<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>Basic Planner</title>

  <meta
    name="description"
    content="A simple hourly planner combining Google Calendar and weather."
  />

  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #17202a;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --weather: #eff6ff;
      --calendar: #f8fafc;
      --current: #fff7ed;
      --shadow: 0 4px 18px rgba(0,0,0,.06);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px;
    }

    /* -----------------------------
       Header
    ----------------------------- */

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      display: grid;
      place-items: center;
      font-size: 23px;
      box-shadow: var(--shadow);
    }

    .brand h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.1;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* -----------------------------
       Controls
    ----------------------------- */

    .controls {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .controls-row {
      display: flex;
      align-items: end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    input[type="date"],
    input[type="text"] {
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 0 11px;
      background: white;
      color: var(--text);
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }

    .zip-input {
      width: 125px;
    }

    .date-input {
      width: 160px;
    }

    button {
      border: 0;
      border-radius: 9px;
      min-height: 40px;
      padding: 0 14px;
      background: #eef2f7;
      color: var(--text);
      font-weight: 650;
    }

    button:hover {
      background: #e5eaf0;
    }

    .primary {
      background: var(--primary);
      color: white;
    }

    .primary:hover {
      background: var(--primary-dark);
    }

    .danger {
      background: #fee2e2;
      color: #991b1b;
    }

    .nav-buttons {
      display: flex;
      gap: 6px;
    }

    /* -----------------------------
       Status
    ----------------------------- */

    #status {
      margin: 10px 2px 0;
      min-height: 20px;
      font-size: 13px;
      color: var(--muted);
    }

    #status.error {
      color: #b91c1c;
    }

    #status.success {
      color: #15803d;
    }

    /* -----------------------------
       Planner
    ----------------------------- */

    .planner {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .planner-header {
      display: grid;
      grid-template-columns: 110px 1fr 1.5fr;
      background: #111827;
      color: white;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .planner-header > div {
      padding: 13px 14px;
      font-size: 12px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .hour-row {
      display: grid;
      grid-template-columns: 110px 1fr 1.5fr;
      min-height: 76px;
      border-top: 1px solid var(--border);
    }

    .hour-row.current {
      background: var(--current);
    }

    .hour-row > div {
      padding: 13px 14px;
      border-right: 1px solid var(--border);
    }

    .hour-row > div:last-child {
      border-right: 0;
    }

    .time-cell {
      font-weight: 750;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .time-main {
      font-size: 15px;
    }

    .time-sub {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
    }

    .weather-cell {
      background: var(--weather);
    }

    .weather-main {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .weather-icon {
      font-size: 27px;
      width: 34px;
      text-align: center;
    }

    .temperature {
      font-size: 19px;
      font-weight: 800;
    }

    .weather-description {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
    }

    .weather-extra {
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
    }

    .plan-cell {
      background: var(--calendar);
    }

    .no-plan {
      color: #9ca3af;
      font-size: 13px;
      font-style: italic;
    }

    .event {
      border-left: 4px solid var(--primary);
      padding: 8px 10px;
      background: white;
      border-radius: 7px;
      margin-bottom: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,.05);
    }

    .event:last-child {
      margin-bottom: 0;
    }

    .event-title {
      font-weight: 750;
      font-size: 14px;
    }

    .event-time {
      margin-top: 3px;
      font-size: 11px;
      color: var(--muted);
    }

    .event-location {
      margin-top: 3px;
      font-size: 11px;
      color: var(--muted);
    }

    /* -----------------------------
       Setup / empty state
    ----------------------------- */

    .setup {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .setup h2 {
      margin: 0 0 8px;
      font-size: 19px;
    }

    .setup p {
      color: var(--muted);
      line-height: 1.55;
      font-size: 14px;
      margin: 6px 0;
    }

    .setup-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .hidden {
      display: none !important;
    }

    /* -----------------------------
       Mobile
    ----------------------------- */

    @media (max-width: 700px) {
      .app {
        padding: 10px;
      }

      .brand h1 {
        font-size: 20px;
      }

      .planner-header {
        grid-template-columns: 78px 1fr 1.25fr;
      }

      .hour-row {
        grid-template-columns: 78px 1fr 1.25fr;
      }

      .planner-header > div,
      .hour-row > div {
        padding: 10px 8px;
      }

      .time-main {
        font-size: 13px;
      }

      .temperature {
        font-size: 16px;
      }

      .weather-icon {
        font-size: 21px;
        width: 27px;
      }

      .event-title {
        font-size: 12px;
      }

      .event {
        padding: 7px;
      }

      .controls-row {
        align-items: stretch;
      }

      .field,
      .date-input,
      .zip-input {
        width: 100%;
      }

      .nav-buttons {
        width: 100%;
      }

      .nav-buttons button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="brand">
      <div class="logo">📅</div>
      <div>
        <h1>Basic Planner</h1>
        <p>Your day, weather, and plans in one view.</p>
      </div>
    </div>

    <div class="header-actions">
      <button id="googleButton" class="primary">
        Connect Google Calendar
      </button>

      <button id="signOutButton" class="danger hidden">
        Disconnect
      </button>
    </div>
  </header>


  <!-- SETUP -->
  <section id="setupPanel" class="setup">

    <h2>Let's set up your planner</h2>

    <p>
      Enter your ZIP code to get hourly weather and connect Google Calendar
      to automatically display your plans.
    </p>

    <div class="setup-actions">

      <div class="field">
        <label for="setupZip">ZIP Code</label>
        <input
          id="setupZip"
          class="zip-input"
          type="text"
          inputmode="numeric"
          maxlength="10"
          placeholder="48601"
        />
      </div>

      <button id="setupWeatherButton" class="primary">
        Save Location
      </button>

    </div>

  </section>


  <!-- CONTROLS -->
  <section class="controls">

    <div class="controls-row">

      <div class="field">
        <label for="datePicker">Date</label>
        <input id="datePicker" class="date-input" type="date" />
      </div>

      <div class="nav-buttons">
        <button id="previousDay">← Previous</button>
        <button id="todayButton">Today</button>
        <button id="nextDay">Next →</button>
      </div>

      <div class="field">
        <label for="zipInput">Weather ZIP</label>
        <input
          id="zipInput"
          class="zip-input"
          type="text"
          inputmode="numeric"
          maxlength="10"
          placeholder="48601"
        />
      </div>

      <button id="weatherButton" class="primary">
        Update Weather
      </button>

      <button id="refreshButton">
        ↻ Refresh
      </button>

    </div>

    <div id="status">
      Ready.
    </div>

  </section>


  <!-- PLANNER -->
  <main class="planner">

    <div class="planner-header">
      <div>Time</div>
      <div>Weather</div>
      <div>Plan</div>
    </div>

    <div id="plannerRows"></div>

  </main>

</div>


<!--
  Google API libraries.

  These are loaded remotely because Google authentication and the
  Calendar API require Google's JavaScript libraries.
-->
<script src="https://apis.google.com/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>


<script>
/* ============================================================
   BASIC PLANNER
   ============================================================

   CONFIGURATION
   ------------------------------------------------------------
   Replace CLIENT_ID with your Google OAuth 2.0 Web Client ID.

   You do NOT need a weather API key for Open-Meteo.

   Google Calendar setup instructions are below the application
   code.
   ============================================================ */


const CONFIG = {

  // Replace this.
  GOOGLE_CLIENT_ID:
    "YOUR_GOOGLE_OAUTH_CLIENT_ID.apps.googleusercontent.com",

  // Google Calendar API discovery document.
  DISCOVERY_DOC:
    "https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest",

  // Read-only access is all Basic Planner needs.
  GOOGLE_SCOPES:
    "https://www.googleapis.com/auth/calendar.readonly",

  // Open-Meteo.
  WEATHER_API:
    "https://api.open-meteo.com/v1/forecast",

  // Open-Meteo's free geocoding API.
  GEOCODING_API:
    "https://geocoding-api.open-meteo.com/v1/search"

};


/* ============================================================
   STATE
   ============================================================ */

let state = {

  zip: localStorage.getItem("basicPlannerZip") || "",

  date:
    localStorage.getItem("basicPlannerDate") ||
    getLocalDateString(new Date()),

  latitude: null,
  longitude: null,
  locationName: "",

  weather: null,

  calendarEvents: [],

  googleReady: false,
  gisReady: false,

  tokenClient: null,
  accessToken: null

};


/* ============================================================
   DOM
   ============================================================ */

const els = {

  setupPanel: document.getElementById("setupPanel"),

  setupZip: document.getElementById("setupZip"),

  setupWeatherButton:
    document.getElementById("setupWeatherButton"),

  googleButton:
    document.getElementById("googleButton"),

  signOutButton:
    document.getElementById("signOutButton"),

  datePicker:
    document.getElementById("datePicker"),

  previousDay:
    document.getElementById("previousDay"),

  todayButton:
    document.getElementById("todayButton"),

  nextDay:
    document.getElementById("nextDay"),

  zipInput:
    document.getElementById("zipInput"),

  weatherButton:
    document.getElementById("weatherButton"),

  refreshButton:
    document.getElementById("refreshButton"),

  status:
    document.getElementById("status"),

  plannerRows:
    document.getElementById("plannerRows")

};


/* ============================================================
   INITIALIZATION
   ============================================================ */

document.addEventListener("DOMContentLoaded", () => {

  els.datePicker.value = state.date;
  els.zipInput.value = state.zip;
  els.setupZip.value = state.zip;

  if (state.zip) {
    els.setupPanel.classList.add("hidden");
  }

  renderEmptyPlanner();

  setupEventListeners();

  initializeGoogle();

});


/* ============================================================
   EVENT LISTENERS
   ============================================================ */

function setupEventListeners() {

  els.setupWeatherButton.addEventListener(
    "click",
    async () => {

      const zip = els.setupZip.value.trim();

      if (!zip) {
        setStatus("Please enter a ZIP code.", true);
        return;
      }

      state.zip = zip;

      localStorage.setItem(
        "basicPlannerZip",
        state.zip
      );

      els.zipInput.value = state.zip;

      els.setupPanel.classList.add("hidden");

      await updateWeather();

    }
  );


  els.weatherButton.addEventListener(
    "click",
    updateWeather
  );


  els.refreshButton.addEventListener(
    "click",
    refreshAll
  );


  els.googleButton.addEventListener(
    "click",
    connectGoogleCalendar
  );


  els.signOutButton.addEventListener(
    "click",
    disconnectGoogle
  );


  els.datePicker.addEventListener(
    "change",
    async () => {

      state.date = els.datePicker.value;

      localStorage.setItem(
        "basicPlannerDate",
        state.date
      );

      await refreshAll();

    }
  );


  els.previousDay.addEventListener(
    "click",
    async () => {

      const date = parseDateOnly(state.date);

      date.setDate(date.getDate() - 1);

      setDate(date);

      await refreshAll();

    }
  );


  els.nextDay.addEventListener(
    "click",
    async () => {

      const date = parseDateOnly(state.date);

      date.setDate(date.getDate() + 1);

      setDate(date);

      await refreshAll();

    }
  );


  els.todayButton.addEventListener(
    "click",
    async () => {

      setDate(new Date());

      await refreshAll();

    }
  );

}


/* ============================================================
   DATE HELPERS
   ============================================================ */

function getLocalDateString(date) {

  const year = date.getFullYear();

  const month = String(
    date.getMonth() + 1
  ).padStart(2, "0");

  const day = String(
    date.getDate()
  ).padStart(2, "0");

  return `${year}-${month}-${day}`;

}


function parseDateOnly(dateString) {

  const [year, month, day] =
    dateString.split("-").map(Number);

  return new Date(
    year,
    month - 1,
    day
  );

}


function setDate(date) {

  state.date = getLocalDateString(date);

  els.datePicker.value = state.date;

  localStorage.setItem(
    "basicPlannerDate",
    state.date
  );

}


/* ============================================================
   GOOGLE CALENDAR INITIALIZATION
   ============================================================ */

function initializeGoogle() {

  if (
    CONFIG.GOOGLE_CLIENT_ID.startsWith("YOUR_")
  ) {

    setStatus(
      "Google Calendar is not configured yet. Add your OAuth client ID to the HTML."
    );

    return;

  }


  // Google API client.
  window.gapiLoaded = async function() {

    gapi.load(
      "client",
      async () => {

        try {

          await gapi.client.init({
            discoveryDocs: [
              CONFIG.DISCOVERY_DOC
            ]
          });

          state.googleReady = true;

          maybeEnableGoogle();

        } catch (error) {

          console.error(error);

          setStatus(
            "Unable to initialize Google Calendar.",
            true
          );

        }

      }
    );

  };


  // Google Identity Services.
  window.gisLoaded = function() {

    state.tokenClient =
      google.accounts.oauth2.initTokenClient({

        client_id:
          CONFIG.GOOGLE_CLIENT_ID,

        scope:
          CONFIG.GOOGLE_SCOPES,

        callback: ""

      });


    state.gisReady = true;

    maybeEnableGoogle();

  };


  /*
    The scripts are already loading.

    Their callbacks are manually triggered if the libraries
    have finished loading.
  */

  if (window.gapi) {

    window.gapiLoaded();

  }


  if (
    window.google &&
    window.google.accounts
  ) {

    window.gisLoaded();

  }


  // Fallback polling because this is a single HTML file.
  const waitForGoogle = setInterval(() => {

    if (
      !state.googleReady &&
      window.gapi
    ) {

      try {

        window.gapiLoaded();

      } catch (_) {}

    }


    if (
      !state.gisReady &&
      window.google &&
      window.google.accounts
    ) {

      try {

        window.gisLoaded();

      } catch (_) {}

    }


    if (
      state.googleReady &&
      state.gisReady
    ) {

      clearInterval(waitForGoogle);

      maybeEnableGoogle();

    }

  }, 300);

}


function maybeEnableGoogle() {

  if (
    state.googleReady &&
    state.gisReady
  ) {

    els.googleButton.disabled = false;

  }

}


/* ============================================================
   GOOGLE CALENDAR AUTHENTICATION
   ============================================================ */

function connectGoogleCalendar() {

  if (
    !state.googleReady ||
    !state.gisReady
  ) {

    setStatus(
      "Google Calendar is still loading. Please try again.",
      true
    );

    return;

  }


  state.tokenClient.callback =
    async (response) => {

      if (response.error) {

        console.error(response);

        setStatus(
          "Google Calendar authorization failed.",
          true
        );

        return;

      }

      state.accessToken =
        response.access_token;

      els.googleButton.textContent =
        "Google Calendar Connected";

      els.googleButton.classList.remove(
        "primary"
      );

      els.signOutButton.classList.remove(
        "hidden"
      );

      setStatus(
        "Google Calendar connected.",
        false,
        true
      );

      await loadCalendarEvents();

    };


  /*
    If there is already a token, requesting another token
    can be done without prompting depending on Google's
    authorization state.
  */

  state.tokenClient.requestAccessToken({
    prompt: state.accessToken
      ? ""
      : "consent"
  });

}


/* ============================================================
   GOOGLE CALENDAR DISCONNECT
   ============================================================ */

function disconnectGoogle() {

  if (state.accessToken) {

    google.accounts.oauth2.revoke(
      state.accessToken,
      () => {}
    );

  }

  state.accessToken = null;

  state.calendarEvents = [];

  els.googleButton.textContent =
    "Connect Google Calendar";

  els.googleButton.classList.add(
    "primary"
  );

  els.signOutButton.classList.add(
    "hidden"
  );

  setStatus(
    "Google Calendar disconnected."
  );

  renderPlanner();

}


/* ============================================================
   LOAD CALENDAR EVENTS
   ============================================================ */

async function loadCalendarEvents() {

  if (!state.accessToken) {

    return;

  }


  try {

    setStatus(
      "Loading Google Calendar..."
    );


    const start =
      parseDateOnly(state.date);

    const end =
      new Date(start);

    end.setDate(
      end.getDate() + 1
    );


    /*
      We intentionally use local midnight here.

      Google Calendar returns events with their timezone
      information, and the event data is then interpreted
      by the browser.
    */

    const response =
      await gapi.client.calendar.events.list({

        calendarId: "primary",

        timeMin:
          start.toISOString(),

        timeMax:
          end.toISOString(),

        singleEvents: true,

        orderBy: "startTime",

        maxResults: 250

      });


    state.calendarEvents =
      response.result.items || [];


    setStatus(
      `${state.calendarEvents.length} calendar event(s) loaded.`,
      false,
      true
    );


    renderPlanner();


  } catch (error) {

    console.error(error);

    if (
      error.result &&
      error.result.error &&
      error.result.error.code === 401
    ) {

      state.accessToken = null;

      setStatus(
        "Google authorization expired. Please reconnect.",
        true
      );

    } else {

      setStatus(
        "Could not load Google Calendar events.",
        true
      );

    }

  }

}


/* ============================================================
   WEATHER
   ============================================================ */

async function updateWeather() {

  const zip =
    els.zipInput.value.trim();

  if (!zip) {

    setStatus(
      "Enter a ZIP code first.",
      true
    );

    return;

  }


  state.zip = zip;

  localStorage.setItem(
    "basicPlannerZip",
    state.zip
  );


  try {

    setStatus(
      `Finding ${zip}...`
    );


    /*
      Step 1:
      Convert ZIP code into latitude/longitude.
    */

    const geoUrl =
      `${CONFIG.GEOCODING_API}` +
      `?name=${encodeURIComponent(zip)}` +
      `&count=1` +
      `&language=en` +
      `&format=json`;


    const geoResponse =
      await fetch(geoUrl);


    if (!geoResponse.ok) {

      throw new Error(
        "Geocoding request failed."
      );

    }


    const geo =
      await geoResponse.json();


    if (
      !geo.results ||
      !geo.results.length
    ) {

      throw new Error(
        "ZIP code not found."
      );

    }


    const location =
      geo.results[0];


    state.latitude =
      location.latitude;

    state.longitude =
      location.longitude;

    state.locationName =
      [
        location.name,
        location.admin1
      ]
      .filter(Boolean)
      .join(", ");


    /*
      Step 2:
      Get hourly forecast.
    */

    setStatus(
      `Loading weather for ${state.locationName}...`
    );


    const weatherUrl =
      `${CONFIG.WEATHER_API}` +
      `?latitude=${state.latitude}` +
      `&longitude=${state.longitude}` +
      `&hourly=` +
      [
        "temperature_2m",
        "apparent_temperature",
        "precipitation_probability",
        "weather_code",
        "wind_speed_10m"
      ].join(",") +
      `&temperature_unit=fahrenheit` +
      `&wind_speed_unit=mph` +
      `&timezone=auto` +
      `&forecast_days=7`;


    const weatherResponse =
      await fetch(weatherUrl);


    if (!weatherResponse.ok) {

      throw new Error(
        "Weather request failed."
      );

    }


    state.weather =
      await weatherResponse.json();


    setStatus(
      `Weather updated for ${state.locationName}.`,
      false,
      true
    );


    renderPlanner();


  } catch (error) {

    console.error(error);

    setStatus(
      error.message ||
      "Unable to load weather.",
      true
    );

  }

}


/* ============================================================
   WEATHER HELPERS
   ============================================================ */

function weatherCodeToIcon(code) {

  if (code === 0) return "☀️";

  if (
    [1, 2].includes(code)
  ) return "🌤️";

  if (code === 3) return "☁️";

  if (
    [45, 48].includes(code)
  ) return "🌫️";

  if (
    [51, 53, 55, 56, 57].includes(code)
  ) return "🌦️";

  if (
    [61, 63, 65, 66, 67].includes(code)
  ) return "🌧️";

  if (
    [71, 73, 75, 77].includes(code)
  ) return "🌨️";

  if (
    [80, 81, 82].includes(code)
  ) return "🌦️";

  if (
    [85, 86].includes(code)
  ) return "🌨️";

  if (
    [95, 96, 99].includes(code)
  ) return "⛈️";

  return "🌡️";

}


function weatherCodeToDescription(code) {

  const descriptions = {

    0: "Clear",

    1: "Mostly clear",

    2: "Partly cloudy",

    3: "Overcast",

    45: "Foggy",

    48: "Rime fog",

    51: "Light drizzle",

    53: "Drizzle",

    55: "Heavy drizzle",

    56: "Freezing drizzle",

    57: "Heavy freezing drizzle",

    61: "Light rain",

    63: "Rain",

    65: "Heavy rain",

    66: "Freezing rain",

    67: "Heavy freezing rain",

    71: "Light snow",

    73: "Snow",

    75: "Heavy snow",

    77: "Snow grains",

    80: "Light showers",

    81: "Showers",

    82: "Heavy showers",

    85: "Snow showers",

    86: "Heavy snow showers",

    95: "Thunderstorm",

    96: "Thunderstorm + hail",

    99: "Thunderstorm + hail"

  };


  return descriptions[code] ||
    "Unknown";

}


/*
  Find the hourly weather index corresponding to
  a particular hour of the selected date.
*/

function getWeatherForHour(hour) {

  if (!state.weather) {

    return null;

  }


  const date =
    `${state.date}T` +
    String(hour).padStart(2, "0") +
    ":00";


  const index =
    state.weather.hourly.time.indexOf(
      date
    );


  if (index === -1) {

    return null;

  }


  return {

    temperature:
      state.weather.hourly.temperature_2m[index],

    apparent:
      state.weather.hourly.apparent_temperature[index],

    precipitation:
      state.weather.hourly.precipitation_probability[index],

    code:
      state.weather.hourly.weather_code[index],

    wind:
      state.weather.hourly.wind_speed_10m[index]

  };

}


/* ============================================================
   CALENDAR HELPERS
   ============================================================ */

function getEventStart(event) {

  if (event.start.dateTime) {

    return new Date(
      event.start.dateTime
    );

  }

  if (event.start.date) {

    return parseDateOnly(
      event.start.date
    );

  }

  return null;

}


function getEventEnd(event) {

  if (event.end.dateTime) {

    return new Date(
      event.end.dateTime
    );

  }

  if (event.end.date) {

    return parseDateOnly(
      event.end.date
    );

  }

  return null;

}


/*
  Determines whether an event occupies a particular
  hour on the selected day.
*/

function eventOccupiesHour(event, hour) {

  const day =
    parseDateOnly(state.date);


  const hourStart =
    new Date(day);

  hourStart.setHours(
    hour,
    0,
    0,
    0
  );


  const hourEnd =
    new Date(hourStart);

  hourEnd.setHours(
    hour + 1,
    0,
    0,
    0
  );


  const start =
    getEventStart(event);

  const end =
    getEventEnd(event);


  if (!start || !end) {

    return false;

  }


  /*
    All-day events have no dateTime.
    Treat them as occupying the whole day.
  */

  if (
    event.start.date &&
    event.end.date
  ) {

    const eventDate =
      event.start.date;

    return (
      eventDate <= state.date &&
      event.end.date > state.date
    );

  }


  return (
    start < hourEnd &&
    end > hourStart
  );

}


function formatEventTime(event) {

  if (
    event.start &&
    event.start.dateTime &&
    event.end &&
    event.end.dateTime
  ) {

    const start =
      new Date(
        event.start.dateTime
      );

    const end =
      new Date(
        event.end.dateTime
      );


    return (
      formatTime(start) +
      " – " +
      formatTime(end)
    );

  }


  return "All day";

}


/* ============================================================
   RENDERING
   ============================================================ */

function renderEmptyPlanner() {

  els.plannerRows.innerHTML = "";

  for (
    let hour = 0;
    hour < 24;
    hour++
  ) {

    const row =
      document.createElement("div");

    row.className = "hour-row";


    const time =
      document.createElement("div");

    time.className = "time-cell";

    time.innerHTML = `
      <div class="time-main">
        ${formatHour(hour)}
      </div>
      <div class="time-sub">
        ${getDayName(state.date)}
      </div>
    `;


    const weather =
      document.createElement("div");

    weather.className =
      "weather-cell";

    weather.innerHTML =
      `<div class="no-plan">
        Weather loading...
      </div>`;


    const plan =
      document.createElement("div");

    plan.className =
      "plan-cell";

    plan.innerHTML =
      `<div class="no-plan">
        No plan
      </div>`;


    row.appendChild(time);
    row.appendChild(weather);
    row.appendChild(plan);

    els.plannerRows.appendChild(row);

  }

}


function renderPlanner() {

  els.plannerRows.innerHTML = "";


  const now =
    new Date();

  const today =
    getLocalDateString(now);


  for (
    let hour = 0;
    hour < 24;
    hour++
  ) {

    const row =
      document.createElement("div");

    row.className =
      "hour-row";


    /*
      Highlight the current hour.
    */

    if (
      state.date === today &&
      now.getHours() === hour
    ) {

      row.classList.add("current");

    }


    /* TIME */

    const timeCell =
      document.createElement("div");

    timeCell.className =
      "time-cell";

    timeCell.innerHTML = `
      <div class="time-main">
        ${formatHour(hour)}
      </div>

      <div class="time-sub">
        ${hour === 0 ? getDayName(state.date) : ""}
      </div>
    `;


    /* WEATHER */

    const weatherCell =
      document.createElement("div");

    weatherCell.className =
      "weather-cell";


    const weather =
      getWeatherForHour(hour);


    if (weather) {

      weatherCell.innerHTML = `

        <div class="weather-main">

          <div class="weather-icon">
            ${weatherCodeToIcon(weather.code)}
          </div>

          <div>
            <div class="temperature">
              ${Math.round(weather.temperature)}°F
            </div>

            <div class="weather-description">
              ${weatherCodeToDescription(weather.code)}
            </div>
          </div>

        </div>

        <div class="weather-extra">
          Feels ${Math.round(weather.apparent)}°
          · ${weather.precipitation}% rain
          · Wind ${Math.round(weather.wind)} mph
        </div>

      `;

    } else {

      weatherCell.innerHTML =
        `<div class="no-plan">
          No weather data
        </div>`;

    }


    /* CALENDAR */

    const planCell =
      document.createElement("div");

    planCell.className =
      "plan-cell";


    const events =
      state.calendarEvents.filter(
        event =>
          eventOccupiesHour(
            event,
            hour
          )
      );


    if (!events.length) {

      planCell.innerHTML =
        `<div class="no-plan">
          No plan
        </div>`;

    } else {

      events.forEach(event => {

        const card =
          document.createElement("div");

        card.className =
          "event";


        const location =
          event.location
            ? `
              <div class="event-location">
                📍 ${escapeHtml(
                  event.location
                )}
              </div>
            `
            : "";


        card.innerHTML = `

          <div class="event-title">
            ${escapeHtml(
              event.summary ||
              "Untitled event"
            )}
          </div>

          <div class="event-time">
            ${formatEventTime(event)}
          </div>

          ${location}

        `;


        planCell.appendChild(card);

      });

    }


    row.appendChild(timeCell);
    row.appendChild(weatherCell);
    row.appendChild(planCell);

    els.plannerRows.appendChild(row);

  }

}


/* ============================================================
   REFRESH
   ============================================================ */

async function refreshAll() {

  renderPlanner();


  const tasks = [];


  if (state.zip) {

    tasks.push(
      updateWeather()
    );

  }


  if (state.accessToken) {

    tasks.push(
      loadCalendarEvents()
    );

  }


  if (!tasks.length) {

    setStatus(
      "Enter a ZIP code and/or connect Google Calendar."
    );

    return;

  }


  await Promise.allSettled(tasks);

}


/* ============================================================
   UI HELPERS
   ============================================================ */

function setStatus(
  message,
  error = false,
  success = false
) {

  els.status.textContent =
    message;

  els.status.className = "";

  if (error) {

    els.status.classList.add(
      "error"
    );

  } else if (success) {

    els.status.classList.add(
      "success"
    );

  }

}


function formatHour(hour) {

  const suffix =
    hour >= 12
      ? "PM"
      : "AM";

  let display =
    hour % 12;

  if (display === 0) {

    display = 12;

  }

  return `${display}:00 ${suffix}`;

}


function formatTime(date) {

  return date.toLocaleTimeString(
    [],
    {
      hour: "numeric",
      minute: "2-digit"
    }
  );

}


function getDayName(dateString) {

  const date =
    parseDateOnly(dateString);

  return date.toLocaleDateString(
    [],
    {
      weekday: "short",
      month: "short",
      day: "numeric"
    }
  );

}


/*
  Important security helper.

  Calendar data comes from an external API.
  Escape event text before placing it into innerHTML.
*/

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* ============================================================
   STARTUP
   ============================================================ */

if (state.zip) {

  /*
    Give the browser a moment to finish loading the
    Google libraries before starting weather.
  */

  setTimeout(() => {

    updateWeather();

  }, 500);

}

</script>
