<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>DayFlow</title>

<style>
  :root {
    --bg: #0b1020;
    --panel: #11182b;
    --panel-2: #172038;
    --border: rgba(255,255,255,.09);
    --text: #f4f7fb;
    --muted: #93a0b7;
    --accent: #6ea8fe;
    --accent-2: #7cdbb6;
    --warning: #ffd166;
    --danger: #ff6b6b;
    --hour-height: 74px;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family:
      Inter, ui-sans-serif, system-ui, -apple-system,
      BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body {
    min-height: 100vh;
  }

  button,
  input {
    font: inherit;
  }

  button {
    cursor: pointer;
  }

  .app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------------- HEADER ---------------- */

  header {
    position: sticky;
    top: 0;
    z-index: 20;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;

    padding:
      max(14px, env(safe-area-inset-top))
      20px
      14px;

    background: rgba(11,16,32,.92);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 40px;
    height: 40px;
    border-radius: 12px;

    display: grid;
    place-items: center;

    background: linear-gradient(
      135deg,
      #6ea8fe,
      #7cdbb6
    );

    color: #08101e;
    font-weight: 900;
    font-size: 19px;
  }

  .brand h1 {
    margin: 0;
    font-size: 19px;
  }

  .brand p {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 12px;
  }

  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .icon-button,
  .primary-button,
  .secondary-button {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 13px;
    background: var(--panel);
    color: var(--text);
  }

  .primary-button {
    background: var(--accent);
    color: #07101e;
    border-color: transparent;
    font-weight: 700;
  }

  .secondary-button:hover,
  .icon-button:hover {
    background: var(--panel-2);
  }

  /* ---------------- CONTROLS ---------------- */

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;

    padding: 14px 20px;

    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }

  .date-button {
    min-width: 210px;
    text-align: center;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 15px;
    font-weight: 700;
  }

  /* ---------------- MAIN GRID ---------------- */

  .planner {
    flex: 1;

    display: grid;
    grid-template-columns:
      90px
      minmax(210px, 0.8fr)
      minmax(300px, 1.4fr);

    min-width: 680px;
  }

  .column {
    border-right: 1px solid var(--border);
  }

  .column:last-child {
    border-right: none;
  }

  .column-header {
    height: 48px;

    display: flex;
    align-items: center;

    padding: 0 15px;

    position: sticky;
    top: 70px;
    z-index: 10;

    background: rgba(17,24,43,.96);
    backdrop-filter: blur(12px);

    border-bottom: 1px solid var(--border);

    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  .timeline {
    position: relative;
  }

  .hour {
    height: var(--hour-height);
    border-bottom: 1px solid var(--border);

    position: relative;
  }

  .hour.current {
    background: rgba(110,168,254,.055);
  }

  .time-cell {
    padding: 12px 10px;
    text-align: right;
  }

  .time-label {
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
  }

  .time-sub {
    margin-top: 4px;
    color: var(--muted);
    font-size: 10px;
  }

  /* ---------------- WEATHER ---------------- */

  .weather-cell {
    display: flex;
    align-items: center;
    gap: 10px;

    padding: 9px 15px;
  }

  .weather-icon {
    width: 38px;
    text-align: center;
    font-size: 26px;
  }

  .weather-temp {
    font-size: 17px;
    font-weight: 800;
  }

  .weather-details {
    margin-top: 2px;
    color: var(--muted);
    font-size: 11px;
  }

  .weather-loading {
    color: var(--muted);
    font-size: 12px;
  }

  /* ---------------- CALENDAR ---------------- */

  .plan-cell {
    padding: 8px 12px;
  }

  .event {
    min-height: 54px;

    display: flex;
    flex-direction: column;
    justify-content: center;

    padding: 9px 11px;

    border-radius: 9px;

    background: rgba(124,219,182,.10);
    border-left: 3px solid var(--accent-2);
  }

  .event + .event {
    margin-top: 6px;
  }

  .event-title {
    font-size: 13px;
    font-weight: 750;
  }

  .event-time {
    margin-top: 4px;
    color: var(--muted);
    font-size: 11px;
  }

  .free {
    padding: 14px 10px;
    color: rgba(147,160,183,.45);
    font-size: 12px;
  }

  /* ---------------- SETTINGS ---------------- */

  dialog {
    width: min(500px, calc(100vw - 30px));
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 0;

    background: var(--panel);
    color: var(--text);

    box-shadow: 0 30px 100px rgba(0,0,0,.55);
  }

  dialog::backdrop {
    background: rgba(0,0,0,.65);
    backdrop-filter: blur(4px);
  }

  .dialog-content {
    padding: 22px;
  }

  .dialog-content h2 {
    margin: 0 0 8px;
  }

  .dialog-content p {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
  }

  label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;

    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }

  input[type="text"],
  input[type="date"] {
    width: 100%;
    padding: 11px 12px;

    border: 1px solid var(--border);
    border-radius: 9px;

    background: var(--bg);
    color: var(--text);

    outline: none;
  }

  input:focus {
    border-color: var(--accent);
  }

  .dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 22px;
  }

  .status {
    margin-top: 12px;
    min-height: 18px;
    font-size: 12px;
  }

  .status.success {
    color: var(--accent-2);
  }

  .status.error {
    color: var(--danger);
  }

  /* ---------------- EMPTY STATE ---------------- */

  .empty {
    padding: 50px 25px;
    text-align: center;
    color: var(--muted);
  }

  /* ---------------- MOBILE ---------------- */

  @media (max-width: 720px) {
    header {
      padding-left: 13px;
      padding-right: 13px;
    }

    .brand p {
      display: none;
    }

    .controls {
      justify-content: space-between;
      padding: 10px;
    }

    .date-button {
      min-width: 0;
      flex: 1;
    }

    /*
      On phones the three-column planner remains horizontally
      scrollable rather than crushing the columns.
    */

    .planner {
      grid-template-columns:
        75px
        180px
        300px;
    }

    .column-header {
      top: 66px;
    }
  }
</style>
</head>

<body>

<div class="app">

  <header>
    <div class="brand">
      <div class="logo">D</div>

      <div>
        <h1>DayFlow</h1>
        <p>Time · Weather · Plans</p>
      </div>
    </div>

    <div class="header-actions">
      <button
        class="secondary-button"
        id="calendarButton">
        Connect Calendar
      </button>

      <button
        class="icon-button"
        id="settingsButton"
        aria-label="Settings">
        ⚙
      </button>
    </div>
  </header>

  <div class="controls">

    <button class="icon-button" id="previousDay">
      ←
    </button>

    <button class="date-button" id="dateButton">
      Today
    </button>

    <button class="icon-button" id="nextDay">
      →
    </button>

  </div>

  <main class="planner">

    <!-- TIME -->

    <section class="column">
      <div class="column-header">
        Time
      </div>

      <div id="timeColumn" class="timeline"></div>
    </section>


    <!-- WEATHER -->

    <section class="column">
      <div class="column-header">
        Weather
      </div>

      <div id="weatherColumn" class="timeline">
      </div>
    </section>


    <!-- PLANS -->

    <section class="column">
      <div class="column-header">
        Plans
      </div>

      <div id="planColumn" class="timeline">
      </div>
    </section>

  </main>

</div>


<!-- SETTINGS DIALOG -->

<dialog id="settingsDialog">

  <div class="dialog-content">

    <h2>DayFlow Settings</h2>

    <p>
      Enter your ZIP code to load hourly weather for your location.
      Your ZIP code stays in this browser.
    </p>

    <label for="zipInput">
      ZIP code
    </label>

    <input
      id="zipInput"
      type="text"
      inputmode="numeric"
      maxlength="10"
      placeholder="48601">

    <label for="clientIdInput">
      Google OAuth Client ID
    </label>

    <input
      id="clientIdInput"
      type="text"
      placeholder="1234567890-xxxx.apps.googleusercontent.com">

    <p>
      The Client ID comes from your Google Cloud project.
      Do not put a client secret in this file.
    </p>

    <div
      id="settingsStatus"
      class="status">
    </div>

    <div class="dialog-actions">

      <button
        class="secondary-button"
        id="cancelSettings">
        Cancel
      </button>

      <button
        class="primary-button"
        id="saveSettings">
        Save
      </button>

    </div>

  </div>

</dialog>


<!-- Google APIs -->

<script
  async
  defer
  src="https://apis.google.com/js/api.js">
</script>

<script
  async
  defer
  src="https://accounts.google.com/gsi/client">
</script>


<script>
/*
=========================================================
DAYFLOW
=========================================================

Architecture:

Google Calendar
      |
      v
Google Calendar API
      |
      v
events[]
      |
      v
hourly planner <---- Open-Meteo hourly weather
      ^
      |
ZIP -> coordinates

Everything is client-side.

=========================================================
*/


/* -------------------------------------------------------
   CONFIGURATION
------------------------------------------------------- */

const GOOGLE_DISCOVERY_DOC =
  "https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest";

const GOOGLE_SCOPE =
  "https://www.googleapis.com/auth/calendar.events.readonly";

let GOOGLE_CLIENT_ID = "";


/* -------------------------------------------------------
   APPLICATION STATE
------------------------------------------------------- */

const state = {

  date: new Date(),

  zip: localStorage.getItem("dayflow_zip") || "",

  clientId:
    localStorage.getItem("dayflow_client_id") || "",

  coordinates: null,

  weather: null,

  events: [],

  accessToken: null,

  gapiReady: false,

  gisReady: false,

  tokenClient: null

};


/* -------------------------------------------------------
   DOM
------------------------------------------------------- */

const timeColumn =
  document.getElementById("timeColumn");

const weatherColumn =
  document.getElementById("weatherColumn");

const planColumn =
  document.getElementById("planColumn");

const dateButton =
  document.getElementById("dateButton");

const calendarButton =
  document.getElementById("calendarButton");

const settingsDialog =
  document.getElementById("settingsDialog");

const zipInput =
  document.getElementById("zipInput");

const clientIdInput =
  document.getElementById("clientIdInput");

const settingsStatus =
  document.getElementById("settingsStatus");


/* -------------------------------------------------------
   HELPERS
------------------------------------------------------- */

function pad(number) {
  return String(number).padStart(2, "0");
}


function dateKey(date) {
  return [
    date.getFullYear(),
    pad(date.getMonth() + 1),
    pad(date.getDate())
  ].join("-");
}


function formatDate(date) {

  return date.toLocaleDateString(
    undefined,
    {
      weekday: "long",
      month: "long",
      day: "numeric"
    }
  );

}


function formatHour(hour) {

  const suffix = hour >= 12 ? "PM" : "AM";

  let h = hour % 12;

  if (h === 0) {
    h = 12;
  }

  return `${h} ${suffix}`;
}


function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* -------------------------------------------------------
   DATE NAVIGATION
------------------------------------------------------- */

function renderDateHeader() {

  const today = new Date();

  const selected =
    dateKey(state.date);

  const todayKey =
    dateKey(today);

  if (selected === todayKey) {
    dateButton.textContent = "Today";
  } else {
    dateButton.textContent =
      formatDate(state.date);
  }

}


document
  .getElementById("previousDay")
  .addEventListener("click", () => {

    state.date.setDate(
      state.date.getDate() - 1
    );

    refresh();

  });


document
  .getElementById("nextDay")
  .addEventListener("click", () => {

    state.date.setDate(
      state.date.getDate() + 1
    );

    refresh();

  });


dateButton.addEventListener(
  "click",
  () => {

    const date =
      prompt(
        "Enter date as YYYY-MM-DD",
        dateKey(state.date)
      );

    if (!date) return;

    const parsed =
      new Date(date + "T12:00:00");

    if (Number.isNaN(parsed.getTime())) {
      alert("Invalid date.");
      return;
    }

    state.date = parsed;

    refresh();

  }
);


/* -------------------------------------------------------
   TIME COLUMN
------------------------------------------------------- */

function renderTimeColumn() {

  timeColumn.innerHTML = "";

  const now = new Date();

  for (let hour = 0; hour < 24; hour++) {

    const row =
      document.createElement("div");

    row.className = "hour";

    const isToday =
      dateKey(state.date) === dateKey(now);

    if (
      isToday &&
      now.getHours() === hour
    ) {
      row.classList.add("current");
    }

    row.innerHTML = `
      <div class="time-cell">
        <div class="time-label">
          ${formatHour(hour)}
        </div>

        <div class="time-sub">
          ${pad(hour)}:00
        </div>
      </div>
    `;

    timeColumn.appendChild(row);
  }

}


/* -------------------------------------------------------
   ZIP -> COORDINATES
------------------------------------------------------- */

/*
Zippopotam.us is used only to turn the ZIP code into
latitude/longitude.

Then Open-Meteo provides the actual hourly forecast.
*/

async function getCoordinatesFromZip(zip) {

  const response =
    await fetch(
      `https://api.zippopotam.us/us/${encodeURIComponent(zip)}`
    );

  if (!response.ok) {
    throw new Error(
      "Could not find that ZIP code."
    );
  }

  const data =
    await response.json();

  if (!data.places?.length) {
    throw new Error(
      "No location found for that ZIP code."
    );
  }

  const place =
    data.places[0];

  return {

    latitude:
      Number(place.latitude),

    longitude:
      Number(place.longitude),

    city:
      place["place name"],

    state:
      place["state abbreviation"]

  };

}


/* -------------------------------------------------------
   WEATHER
------------------------------------------------------- */

function weatherIcon(code) {

  /*
    Open-Meteo / WMO weather codes
  */

  if (code === 0)
    return "☀️";

  if ([1,2].includes(code))
    return "🌤️";

  if (code === 3)
    return "☁️";

  if ([45,48].includes(code))
    return "🌫️";

  if (
    [51,53,55,56,57].includes(code)
  )
    return "🌦️";

  if (
    [61,63,65,66,67].includes(code)
  )
    return "🌧️";

  if (
    [71,73,75,77].includes(code)
  )
    return "🌨️";

  if (
    [80,81,82].includes(code)
  )
    return "🌦️";

  if (
    [85,86].includes(code)
  )
    return "🌨️";

  if (
    [95,96,99].includes(code)
  )
    return "⛈️";

  return "🌡️";
}


async function loadWeather() {

  if (!state.zip) {

    weatherColumn.innerHTML = `
      <div class="empty">
        Enter a ZIP code in settings.
      </div>
    `;

    return;

  }

  try {

    weatherColumn.innerHTML = `
      ${Array.from(
        { length: 24 },
        () => `
          <div class="hour weather-cell">
            <span class="weather-loading">
              Loading weather…
            </span>
          </div>
        `
      ).join("")}
    `;


    /*
      Get coordinates.
    */

    if (!state.coordinates) {

      state.coordinates =
        await getCoordinatesFromZip(
          state.zip
        );

    }


    /*
      Get hourly forecast.

      Open-Meteo does not require an API key for
      normal non-commercial usage.
    */

    const params = new URLSearchParams({

      latitude:
        state.coordinates.latitude,

      longitude:
        state.coordinates.longitude,

      hourly: [
        "temperature_2m",
        "apparent_temperature",
        "precipitation_probability",
        "weather_code",
        "wind_speed_10m"
      ].join(","),

      temperature_unit: "fahrenheit",

      wind_speed_unit: "mph",

      timezone: "auto",

      forecast_days: "7"

    });


    const response =
      await fetch(
        `https://api.open-meteo.com/v1/forecast?${params}`
      );

    if (!response.ok) {
      throw new Error(
        "Weather service returned an error."
      );
    }

    state.weather =
      await response.json();

    renderWeather();

  } catch (error) {

    console.error(error);

    weatherColumn.innerHTML = `
      <div class="empty">
        Weather unavailable.<br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

  }

}


/* -------------------------------------------------------
   WEATHER RENDERING
------------------------------------------------------- */

function renderWeather() {

  if (!state.weather) return;

  const hourly =
    state.weather.hourly;

  const selectedDate =
    dateKey(state.date);

  weatherColumn.innerHTML = "";

  for (let hour = 0; hour < 24; hour++) {

    const row =
      document.createElement("div");

    row.className = "hour";


    /*
      Find the Open-Meteo timestamp corresponding
      to this date and hour.
    */

    const timestamp =
      `${selectedDate}T${pad(hour)}:00`;

    const index =
      hourly.time.indexOf(timestamp);


    if (index === -1) {

      row.innerHTML = `
        <div class="weather-cell">
          <span class="weather-loading">
            —
          </span>
        </div>
      `;

      weatherColumn.appendChild(row);

      continue;

    }


    const temp =
      Math.round(
        hourly.temperature_2m[index]
      );

    const feels =
      Math.round(
        hourly.apparent_temperature[index]
      );

    const precipitation =
      hourly.precipitation_probability[index];

    const wind =
      Math.round(
        hourly.wind_speed_10m[index]
      );

    const code =
      hourly.weather_code[index];


    row.innerHTML = `

      <div class="weather-cell">

        <div class="weather-icon">
          ${weatherIcon(code)}
        </div>

        <div>

          <div class="weather-temp">
            ${temp}°F
          </div>

          <div class="weather-details">
            Feels ${feels}° ·
            💧 ${precipitation ?? 0}% ·
            ${wind} mph
          </div>

        </div>

      </div>

    `;

    weatherColumn.appendChild(row);

  }

}


/* -------------------------------------------------------
   GOOGLE CALENDAR
------------------------------------------------------- */

function initializeGoogle() {

  if (
    !state.clientId ||
    state.clientId.includes("YOUR_")
  ) {
    return;
  }

  GOOGLE_CLIENT_ID =
    state.clientId;


  /*
    Google API JavaScript client.
  */

  if (window.gapi) {

    gapi.load(
      "client",
      async () => {

        try {

          await gapi.client.init({
            discoveryDocs:
              [GOOGLE_DISCOVERY_DOC]
          });

          state.gapiReady = true;

          maybeInitializeGoogleToken();

        } catch (error) {

          console.error(
            "Google API initialization failed",
            error
          );

        }

      }
    );

  }


  /*
    Google Identity Services OAuth client.
  */

  const waitForGoogle =
    setInterval(() => {

      if (
        window.google?.accounts?.oauth2
      ) {

        clearInterval(waitForGoogle);

        state.tokenClient =
          google.accounts.oauth2.initTokenClient({

            client_id:
              GOOGLE_CLIENT_ID,

            scope:
              GOOGLE_SCOPE,

            callback: ""

          });

        state.gisReady = true;

        maybeInitializeGoogleToken();

      }

    }, 100);

}


function maybeInitializeGoogleToken() {

  if (
    state.gapiReady &&
    state.gisReady
  ) {

    calendarButton.disabled = false;

  }

}


/* -------------------------------------------------------
   CONNECT CALENDAR
------------------------------------------------------- */

calendarButton.addEventListener(
  "click",
  async () => {

    if (!state.clientId) {

      settingsDialog.showModal();

      settingsStatus.textContent =
        "Enter your Google OAuth Client ID first.";

      settingsStatus.className =
        "status error";

      return;

    }

    if (
      !state.gapiReady ||
      !state.gisReady
    ) {

      alert(
        "Google services are still loading. Try again in a moment."
      );

      return;

    }


    state.tokenClient.callback =
      async (response) => {

        if (response.error) {

          console.error(response);

          alert(
            "Google authorization failed."
          );

          return;

        }

        state.accessToken =
          response.access_token;

        gapi.client.setToken({
          access_token:
            response.access_token
        });

        calendarButton.textContent =
          "Calendar Connected";

        await loadCalendarEvents();

      };


    /*
      Ask Google for an OAuth access token.
    */

    state.tokenClient.requestAccessToken({
      prompt: ""
    });

  }
);


/* -------------------------------------------------------
   LOAD CALENDAR EVENTS
------------------------------------------------------- */

async function loadCalendarEvents() {

  try {

    const start =
      new Date(state.date);

    start.setHours(
      0, 0, 0, 0
    );


    const end =
      new Date(state.date);

    end.setDate(
      end.getDate() + 1
    );

    end.setHours(
      0, 0, 0, 0
    );


    const response =
      await gapi.client.calendar.events.list({

        calendarId: "primary",

        timeMin:
          start.toISOString(),

        timeMax:
          end.toISOString(),

        showDeleted: false,

        singleEvents: true,

        orderBy: "startTime",

        maxResults: 100

      });


    state.events =
      response.result.items || [];

    renderPlans();


  } catch (error) {

    console.error(error);

    alert(
      "Unable to load Google Calendar events."
    );

  }

}


/* -------------------------------------------------------
   CALENDAR EVENT HELPERS
------------------------------------------------------- */

function eventStart(event) {

  /*
    Timed event.
  */

  if (event.start?.dateTime) {

    return new Date(
      event.start.dateTime
    );

  }


  /*
    All-day event.

    We treat it as beginning at midnight.
  */

  if (event.start?.date) {

    return new Date(
      event.start.date + "T00:00:00"
    );

  }

  return null;

}


function eventEnd(event) {

  if (event.end?.dateTime) {

    return new Date(
      event.end.dateTime
    );

  }

  if (event.end?.date) {

    return new Date(
      event.end.date + "T00:00:00"
    );

  }

  return null;

}


function eventTouchesHour(
  event,
  hour
) {

  const start =
    eventStart(event);

  const end =
    eventEnd(event);

  if (!start || !end) {
    return false;
  }


  const hourStart =
    new Date(state.date);

  hourStart.setHours(
    hour, 0, 0, 0
  );


  const hourEnd =
    new Date(hourStart);

  hourEnd.setHours(
    hour + 1
  );


  return (
    start < hourEnd &&
    end > hourStart
  );

}


function formatEventTime(event) {

  if (
    !event.start?.dateTime
  ) {

    return "All day";

  }

  const start =
    eventStart(event);

  const end =
    eventEnd(event);

  return `
    ${start.toLocaleTimeString(
      undefined,
      {
        hour: "numeric",
        minute: "2-digit"
      }
    )}
    –
    ${end.toLocaleTimeString(
      undefined,
      {
        hour: "numeric",
        minute: "2-digit"
      }
    )}
  `;

}


/* -------------------------------------------------------
   RENDER PLANS
------------------------------------------------------- */

function renderPlans() {

  planColumn.innerHTML = "";


  for (let hour = 0; hour < 24; hour++) {

    const row =
      document.createElement("div");

    row.className = "hour";


    const events =
      state.events.filter(
        event =>
          eventTouchesHour(
            event,
            hour
          )
      );


    if (!events.length) {

      row.innerHTML = `
        <div class="free">
          Free
        </div>
      `;

    } else {

      row.innerHTML =
        `<div class="plan-cell">
          ${
            events.map(event => `
              <div class="event">

                <div class="event-title">
                  ${escapeHtml(
                    event.summary ||
                    "Untitled event"
                  )}
                </div>

                <div class="event-time">
                  ${formatEventTime(event)}
                </div>

              </div>
            `).join("")
          }
        </div>`;

    }


    planColumn.appendChild(row);

  }

}


/* -------------------------------------------------------
   SETTINGS
------------------------------------------------------- */

document
  .getElementById("settingsButton")
  .addEventListener(
    "click",
    () => {

      zipInput.value =
        state.zip;

      clientIdInput.value =
        state.clientId;

      settingsStatus.textContent = "";

      settingsDialog.showModal();

    }
  );


document
  .getElementById("cancelSettings")
  .addEventListener(
    "click",
    () => {

      settingsDialog.close();

    }
  );


document
  .getElementById("saveSettings")
  .addEventListener(
    "click",
    async () => {

      const zip =
        zipInput.value.trim();

      const clientId =
        clientIdInput.value.trim();


      if (!/^\d{5}(-\d{4})?$/.test(zip)) {

        settingsStatus.textContent =
          "Please enter a valid US ZIP code.";

        settingsStatus.className =
          "status error";

        return;

      }


      state.zip =
        zip;

      state.clientId =
        clientId;


      localStorage.setItem(
        "dayflow_zip",
        zip
      );

      localStorage.setItem(
        "dayflow_client_id",
        clientId
      );


      /*
        Clear old coordinates so a changed ZIP
        gets a fresh lookup.
      */

      state.coordinates = null;


      settingsStatus.textContent =
        "Settings saved.";

      settingsStatus.className =
        "status success";


      setTimeout(() => {

        settingsDialog.close();

        initializeGoogle();

        refresh();

      }, 400);

    }
  );


/* -------------------------------------------------------
   MAIN REFRESH
------------------------------------------------------- */

async function refresh() {

  renderDateHeader();

  renderTimeColumn();

  renderPlans();

  await loadWeather();


  /*
    If Google is already connected, reload events
    for the newly selected date.
  */

  if (
    state.accessToken &&
    state.gapiReady
  ) {

    await loadCalendarEvents();

  }

}


/* -------------------------------------------------------
   INITIALIZE
------------------------------------------------------- */

async function init() {

  calendarButton.disabled = true;

  renderDateHeader();

  renderTimeColumn();

  renderPlans();


  if (state.clientId) {

    initializeGoogle();

  }


  if (state.zip) {

    await loadWeather();

  } else {

    weatherColumn.innerHTML = `
      <div class="empty">
        Open ⚙ and enter your ZIP code.
      </div>
    `;

  }

}


init();

</script>
