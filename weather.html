<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#111827"
  />

  <meta
    name="description"
    content="Basic Planner — time, weather, and Google Calendar in one view."
  />

  <title>Basic Planner</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="weather_style.css" />

 <script src="https://apis.google.com/js/api.js"></script>
 <script src="https://accounts.google.com/gsi/client"></script>
 <script src="weather_script.js"></script>

</head>

<body>

  <!-- =========================================================
       HEADER
  ========================================================== -->

  <header>

    <div class="header-inner">

      <div class="brand">

        <div class="brand-mark">
          BP
        </div>

        <div>

          <h1>
            Basic Planner
          </h1>

          <small>
            Time · Weather · Plans
          </small>

        </div>

      </div>


      <div class="header-actions">

        <div class="calendar-status">

          <span
            id="statusDot"
            class="status-dot"
          ></span>

          <span id="calendarStatus">
            Calendar not connected
          </span>

        </div>


        <button
          id="connectButton"
          onclick="connectGoogleCalendar()"
        >
          Connect Google Calendar
        </button>


        <button
          id="disconnectButton"
          class="secondary"
          style="display: none;"
          onclick="disconnectGoogleCalendar()"
        >
          Disconnect
        </button>

      </div>

    </div>

  </header>


  <!-- =========================================================
       CONTROLS
  ========================================================== -->

  <div class="controls">


    <!-- DATE -->

    <!-- ---------------- DATE NAVIGATION ---------------- -->

<div class="control-group date-navigation">

 <button
  type="button"
  class="secondary date-arrow"
  onclick="changeDay(-1)"
  aria-label="Previous day"
  title="Previous day"
>
  ←
</button>

<label for="datePicker">Day</label>

<input
  type="date"
  id="datePicker"
/>

<button
  type="button"
  class="secondary date-arrow"
  onclick="changeDay(1)"
  aria-label="Next day"
  title="Next day"
>
  →
</button>


</div>



    <!-- ZIP CODE -->

    <div class="control-group">

      <label for="zipCode">
        ZIP
      </label>

      <input
        id="zipCode"
        class="zip-input"
        type="text"
        inputmode="numeric"
        maxlength="10"
        placeholder="48601"
      />

      <button onclick="loadWeather()">
        Weather
      </button>

    </div>


    <!-- CALENDAR SELECTOR -->

    <div
      class="control-group"
      id="calendarSelectorGroup"
      style="display: none;"
    >

      <label for="calendarSelector">
        Calendar
      </label>

      <select
        id="calendarSelector"
        onchange="calendarChanged()"
      ></select>

    </div>


    <!-- REFRESH -->

    <button
      class="secondary"
      onclick="refreshPlanner()"
    >
      ↻ Refresh
    </button>

  </div>


  <!-- =========================================================
       STATUS MESSAGE
  ========================================================== -->

  <div
    id="statusMessage"
    class="status"
  >
    Enter your ZIP code and connect Google Calendar to get started.
  </div>


  <!-- =========================================================
       PLANNER
  ========================================================== -->

  <main class="planner-wrap">

    <div class="planner">


      <!-- TABLE / COLUMN HEADINGS -->

      <div class="column-headings">

        <div class="column-heading">
          Time
        </div>

        <div class="column-heading">
          Weather
        </div>

        <div class="column-heading">
          Plan
        </div>

      </div>


      <!--
        JavaScript creates the 24 hourly rows here.
      -->

      <div id="plannerRows"></div>


    </div>

  </main>


  <!-- =========================================================
       JAVASCRIPT
  ========================================================== -->

  <script src="script.js"></script>

</body>
</html>
