<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Hourly day planner with weather and Google Calendar." />

  <title>DayFlow</title>

  <style>
    :root {
      --bg: #f1f5f9;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --green: #16a34a;
      --yellow: #ca8a04;
      --red: #dc2626;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      padding-bottom: env(safe-area-inset-bottom);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* ----------------------------------------
       HEADER
    ---------------------------------------- */

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 23, 42, 0.96);
      color: white;
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.15);
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      font-size: 22px;
    }

    .brand-text h1 {
      margin: 0;
      font-size: 19px;
      line-height: 1.1;
    }

    .brand-text p {
      margin: 4px 0 0;
      color: #94a3b8;
      font-size: 12px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 9px 13px;
      font-weight: 600;
      font-size: 13px;
      transition: 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-secondary {
      background: #334155;
      color: white;
    }

    .btn-light {
      background: white;
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* ----------------------------------------
       CONTROLS
    ---------------------------------------- */

    .controls {
      max-width: 1400px;
      margin: 0 auto;
      padding: 18px 20px 8px;
    }

    .control-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .date-navigation {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .date-display {
      min-width: 190px;
      text-align: center;
    }

    .date-display .day {
      font-size: 18px;
      font-weight: 750;
    }

    .date-display .date {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .settings {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .zip-input {
      width: 120px;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: white;
    }

    .zip-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
    }

    .status-dot.connected {
      background: var(--green);
    }

    /* ----------------------------------------
       MAIN GRID
    ---------------------------------------- */

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 8px 20px 40px;
    }

    .planner {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .planner-header {
      display: grid;
      grid-template-columns: 160px 300px 1fr;
      background: #0f172a;
      color: white;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .planner-header > div {
      padding: 13px 16px;
    }

    .hour-row {
      display: grid;
      grid-template-columns: 160px 300px 1fr;
      min-height: 86px;
      border-top: 1px solid var(--border);
      position: relative;
    }

    .hour-row.current {
      background: #eff6ff;
    }

    .hour-row.current::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--accent);
    }

    .hour-row.past {
      opacity: 0.7;
    }

    .time-cell,
    .weather-cell,
    .plan-cell {
      padding: 14px 16px;
    }

    .time-cell {
      border-right: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .time-main {
      font-size: 17px;
      font-weight: 750;
      white-space: nowrap;
    }

    .time-period {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
    }

    .now-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 6px;
      border-radius: 5px;
      background: var(--accent);
      color: white;
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .weather-cell {
      border-right: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .weather-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      font-size: 27px;
      border-radius: 12px;
      background: var(--panel-soft);
    }

    .weather-temp {
      font-size: 18px;
      font-weight: 750;
    }

    .weather-description {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .weather-extra {
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
    }

    .plan-cell {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .event {
      border-left: 4px solid var(--accent);
      background: var(--accent-soft);
      border-radius: 8px;
      padding: 9px 11px;
    }

    .event-title {
      font-weight: 700;
      font-size: 14px;
    }

    .event-time {
      color: #475569;
      font-size: 11px;
      margin-top: 3px;
    }

    .event-location {
      color: #475569;
      font-size: 11px;
      margin-top: 3px;
    }

    .free {
      color: #94a3b8;
      font-size: 13px;
      padding-top: 5px;
    }

    .all-day-event {
      border-left-color: #7c3aed;
      background: #f3e8ff;
    }

    /* ----------------------------------------
       LOADING / ERROR
    ---------------------------------------- */

    .message {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
    }

    .spinner {
      width: 30px;
      height: 30px;
      margin: 0 auto 12px;
      border: 3px solid #dbeafe;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error {
      color: #991b1b;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 14px;
      margin: 12px;
      font-size: 13px;
    }

    /* ----------------------------------------
       MOBILE
    ---------------------------------------- */

    @media (max-width: 850px) {
      .header-inner {
        align-items: flex-start;
      }

      .header-actions {
        flex-direction: column;
      }

      .planner-header {
        display: none;
      }

      .hour-row {
        display: grid;
        grid-template-columns: 85px 1fr;
        grid-template-areas:
          "time weather"
          "time plan";
        min-height: 145px;
      }

      .time-cell {
        grid-area: time;
        border-right: 1px solid var(--border);
      }

      .weather-cell {
        grid-area: weather;
        min-height: 68px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .plan-cell {
        grid-area: plan;
        min-height: 65px;
      }

      .controls {
        padding-left: 10px;
        padding-right: 10px;
      }

      main {
        padding-left: 10px;
        padding-right: 10px;
      }

      .control-panel {
        align-items: stretch;
      }

      .date-navigation {
        width: 100%;
        justify-content: space-between;
      }

      .settings {
        width: 100%;
      }

      .zip-input {
        flex: 1;
      }
    }

    @media (max-width: 500px) {
      .brand-text p {
        display: none;
      }

      .btn-text {
        display: none;
      }

      .header-actions .btn {
        padding: 9px 11px;
      }

      .weather-extra {
        display: none;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="brand">
      <div class="brand-icon">☀️</div>

      <div class="brand-text">
        <h1>DayFlow</h1>
        <p>Your day, weather, and plans in one view</p>
      </div>
    </div>

    <div class="header-actions">
      <button
        class="btn btn-secondary"
        id="todayButton"
        title="Go to today"
      >
        Today
      </button>

      <button
        class="btn btn-primary"
        id="googleButton"
        title="Connect Google Calendar"
      >
        Connect Calendar
      </button>
    </div>

  </div>
</header>

<section class="controls">

  <div class="control-panel">

    <div class="date-navigation">

      <button class="btn btn-light" id="previousDay">
        ←
      </button>

      <div class="date-display">
        <div class="day" id="dayName">Loading...</div>
        <div class="date" id="dateName"></div>
      </div>

      <button class="btn btn-light" id="nextDay">
        →
      </button>

    </div>

    <div class="settings">

      <input
        id="zipCode"
        class="zip-input"
        type="text"
        inputmode="numeric"
        maxlength="10"
        placeholder="ZIP code"
        aria-label="ZIP code"
      />

      <button class="btn btn-light" id="weatherButton">
        Update Weather
      </button>

      <div class="connection-status">
        <span class="status-dot" id="calendarDot"></span>
        <span id="calendarStatus">Calendar not connected</span>
      </div>

    </div>

  </div>

</section>

<main>

  <div class="planner">

    <div class="planner-header">
      <div>Time</div>
      <div>Weather</div>
      <div>Plans</div>
    </div>

    <div id="plannerBody">
      <div class="message">
        <div class="spinner"></div>
        Loading...
      </div>
    </div>

  </div>

</main>


<!--
  Google APIs
-->
<script src="https://apis.google.com/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>


<script>
/* =========================================================
   CONFIGURATION
========================================================= */

/*
 * Create these in Google Cloud:
 *
 * 1. Enable Google Calendar API
 * 2. Create an API key
 * 3. Create an OAuth 2.0 Client ID
 *    Application type: Web application
 *
 * Add the domain where this HTML is hosted as an
 * Authorized JavaScript Origin.
 */

const GOOGLE_CLIENT_ID = "YOUR_GOOGLE_CLIENT_ID";
const GOOGLE_API_KEY = "YOUR_GOOGLE_API_KEY";

const CALENDAR_SCOPE =
  "https://www.googleapis.com/auth/calendar.readonly";

const CALENDAR_DISCOVERY =
  "https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest";


/* =========================================================
   APPLICATION STATE
========================================================= */

let selectedDate = new Date();

let weatherData = null;
let calendarEvents = [];

let tokenClient = null;

let gapiReady = false;
let gisReady = false;


/* =========================================================
   DOM
========================================================= */

const plannerBody =
  document.getElementById("plannerBody");

const dayName =
  document.getElementById("dayName");

const dateName =
  document.getElementById("dateName");

const zipInput =
  document.getElementById("zipCode");

const googleButton =
  document.getElementById("googleButton");

const calendarStatus =
  document.getElementById("calendarStatus");

const calendarDot =
  document.getElementById("calendarDot");


/* =========================================================
   DATE HELPERS
========================================================= */

function startOfDay(date) {

  const d = new Date(date);

  d.setHours(0, 0, 0, 0);

  return d;
}


function endOfDay(date) {

  const d = new Date(date);

  d.setHours(23, 59, 59, 999);

  return d;
}


function dateKey(date) {

  const y = date.getFullYear();

  const m = String(date.getMonth() + 1).padStart(2, "0");

  const d = String(date.getDate()).padStart(2, "0");

  return `${y}-${m}-${d}`;
}


function formatDateForDisplay(date) {

  return date.toLocaleDateString(undefined, {
    weekday: "long",
    month: "long",
    day: "numeric",
    year: "numeric"
  });
}


function formatHour(date) {

  return date.toLocaleTimeString(undefined, {
    hour: "numeric",
    minute: "2-digit"
  });
}


/* =========================================================
   WEATHER
========================================================= */

/*
 * Open-Meteo:
 *
 * Step 1:
 * ZIP -> latitude/longitude
 *
 * Step 2:
 * latitude/longitude -> hourly weather
 *
 * No weather API key is required.
 */

async function getCoordinatesFromZip(zip) {

  const url =
    "https://geocoding-api.open-meteo.com/v1/search" +
    "?name=" +
    encodeURIComponent(zip) +
    "&count=5" +
    "&language=en" +
    "&format=json";

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("Could not look up ZIP code.");
  }

  const data = await response.json();

  if (!data.results || data.results.length === 0) {
    throw new Error("ZIP code was not found.");
  }

  /*
   * Prefer a US result when possible.
   */
  const usResult =
    data.results.find(x => x.country_code === "US");

  return usResult || data.results[0];
}


async function getWeather(zip) {

  const location =
    await getCoordinatesFromZip(zip);

  const latitude = location.latitude;
  const longitude = location.longitude;

  const url =
    "https://api.open-meteo.com/v1/forecast" +
    "?latitude=" + latitude +
    "&longitude=" + longitude +
    "&hourly=" +
    [
      "temperature_2m",
      "apparent_temperature",
      "precipitation_probability",
      "weather_code",
      "wind_speed_10m"
    ].join(",") +
    "&temperature_unit=fahrenheit" +
    "&wind_speed_unit=mph" +
    "&timezone=auto" +
    "&forecast_days=7";

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("Weather service failed.");
  }

  const data = await response.json();

  return {
    ...data,
    location
  };
}


/* =========================================================
   WEATHER ICONS
========================================================= */

function weatherIcon(code) {

  /*
   * WMO weather interpretation codes.
   */

  if (code === 0) return "☀️";

  if ([1, 2].includes(code)) return "🌤️";

  if (code === 3) return "☁️";

  if ([45, 48].includes(code)) return "🌫️";

  if (
    [51, 53, 55, 56, 57].includes(code)
  ) {
    return "🌦️";
  }

  if (
    [61, 63, 65, 66, 67].includes(code)
  ) {
    return "🌧️";
  }

  if (
    [71, 73, 75, 77].includes(code)
  ) {
    return "🌨️";
  }

  if (
    [80, 81, 82].includes(code)
  ) {
    return "🌦️";
  }

  if (
    [85, 86].includes(code)
  ) {
    return "🌨️";
  }

  if (
    [95, 96, 99].includes(code)
  ) {
    return "⛈️";
  }

  return "🌡️";
}


function weatherDescription(code) {

  const descriptions = {

    0: "Clear",

    1: "Mostly clear",
    2: "Partly cloudy",
    3: "Cloudy",

    45: "Fog",
    48: "Fog",

    51: "Light drizzle",
    53: "Drizzle",
    55: "Heavy drizzle",

    56: "Freezing drizzle",
    57: "Freezing drizzle",

    61: "Light rain",
    63: "Rain",
    65: "Heavy rain",

    66: "Freezing rain",
    67: "Heavy freezing rain",

    71: "Light snow",
    73: "Snow",
    75: "Heavy snow",
    77: "Snow grains",

    80: "Rain showers",
    81: "Rain showers",
    82: "Heavy showers",

    85: "Snow showers",
    86: "Heavy snow showers",

    95: "Thunderstorm",
    96: "Thunderstorm",
    99: "Thunderstorm"
  };

  return descriptions[code] || "Unknown";
}


/* =========================================================
   WEATHER LOOKUP
========================================================= */

function weatherForHour(date) {

  if (!weatherData || !weatherData.hourly) {
    return null;
  }

  const localDateString =
    dateKey(date);

  /*
   * Open-Meteo returns local-time ISO strings
   * such as:
   *
   * 2026-09-07T14:00
   */

  const targetPrefix =
    localDateString + "T" +
    String(date.getHours()).padStart(2, "0") +
    ":00";

  const index =
    weatherData.hourly.time.findIndex(
      t => t === targetPrefix
    );

  if (index === -1) {
    return null;
  }

  return {
    temperature:
      weatherData.hourly.temperature_2m[index],

    apparent:
      weatherData.hourly.apparent_temperature[index],

    precipitation:
      weatherData.hourly.precipitation_probability[index],

    code:
      weatherData.hourly.weather_code[index],

    wind:
      weatherData.hourly.wind_speed_10m[index]
  };
}


/* =========================================================
   GOOGLE CALENDAR INITIALIZATION
========================================================= */

function gapiLoaded() {

  gapi.load(
    "client",
    initializeGapi
  );
}


async function initializeGapi() {

  try {

    await gapi.client.init({
      apiKey: GOOGLE_API_KEY,
      discoveryDocs: [
        CALENDAR_DISCOVERY
      ]
    });

    gapiReady = true;

    maybeInitializeGoogle();

  } catch (error) {

    console.error(
      "Google API initialization failed:",
      error
    );
  }
}


function gisLoaded() {

  if (
    GOOGLE_CLIENT_ID ===
    "YOUR_GOOGLE_CLIENT_ID"
  ) {
    console.warn(
      "Google Client ID has not been configured."
    );

    return;
  }

  tokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id:
        GOOGLE_CLIENT_ID,

      scope:
        CALENDAR_SCOPE,

      callback: ""
    });

  gisReady = true;

  maybeInitializeGoogle();
}


function maybeInitializeGoogle() {

  if (gapiReady && gisReady) {

    googleButton.disabled = false;

  }
}


/* =========================================================
   GOOGLE CALENDAR AUTH
========================================================= */

googleButton.addEventListener(
  "click",
  connectGoogleCalendar
);


async function connectGoogleCalendar() {

  if (
    GOOGLE_CLIENT_ID ===
    "YOUR_GOOGLE_CLIENT_ID"
  ) {

    alert(
      "Add your Google OAuth Client ID to the HTML first."
    );

    return;
  }

  if (!gapiReady || !gisReady) {

    alert(
      "Google services are still loading. Try again."
    );

    return;
  }

  tokenClient.callback =
    async response => {

      if (response.error) {

        console.error(response);

        calendarStatus.textContent =
          "Calendar connection failed";

        return;
      }

      calendarDot.classList.add(
        "connected"
      );

      calendarStatus.textContent =
        "Google Calendar connected";

      googleButton.textContent =
        "Refresh Calendar";

      await loadCalendar();
    };


  const existingToken =
    gapi.client.getToken();

  if (!existingToken) {

    tokenClient.requestAccessToken({
      prompt: "consent"
    });

  } else {

    tokenClient.requestAccessToken({
      prompt: ""
    });

  }
}


/* =========================================================
   LOAD CALENDAR EVENTS
========================================================= */

async function loadCalendar() {

  if (!gapi.client.getToken()) {
    return;
  }

  try {

    const start =
      startOfDay(selectedDate);

    const end =
      endOfDay(selectedDate);

    const response =
      await gapi.client.calendar.events.list({

        calendarId: "primary",

        timeMin:
          start.toISOString(),

        timeMax:
          end.toISOString(),

        singleEvents: true,

        orderBy: "startTime",

        showDeleted: false,

        maxResults: 250

      });

    calendarEvents =
      response.result.items || [];

    render();

  } catch (error) {

    console.error(
      "Calendar error:",
      error
    );

    calendarEvents = [];

    render();

    alert(
      "Unable to load Google Calendar."
    );
  }
}


/* =========================================================
   CALENDAR EVENT HELPERS
========================================================= */

function eventStart(event) {

  if (event.start.dateTime) {
    return new Date(
      event.start.dateTime
    );
  }

  /*
   * All-day event.
   */
  const parts =
    event.start.date.split("-");

  return new Date(
    Number(parts[0]),
    Number(parts[1]) - 1,
    Number(parts[2]),
    0,
    0,
    0
  );
}


function eventEnd(event) {

  if (event.end.dateTime) {
    return new Date(
      event.end.dateTime
    );
  }

  /*
   * Google all-day end dates are exclusive.
   */
  const parts =
    event.end.date.split("-");

  const date =
    new Date(
      Number(parts[0]),
      Number(parts[1]) - 1,
      Number(parts[2]),
      0,
      0,
      0
    );

  return new Date(
    date.getTime() - 1
  );
}


function eventsForHour(hour) {

  const hourStart =
    new Date(hour);

  const hourEnd =
    new Date(
      hour.getTime() + 60 * 60 * 1000
    );

  return calendarEvents.filter(event => {

    const start =
      eventStart(event);

    const end =
      eventEnd(event);

    return (
      start < hourEnd &&
      end >= hourStart
    );
  });
}


/* =========================================================
   RENDER
========================================================= */

function render() {

  dayName.textContent =
    selectedDate.toLocaleDateString(
      undefined,
      {
        weekday: "long"
      }
    );

  dateName.textContent =
    formatDateForDisplay(
      selectedDate
    );

  renderHours();
}


function renderHours() {

  plannerBody.innerHTML = "";

  const today =
    new Date();

  /*
   * Display 24 hours.
   */

  for (
    let hour = 0;
    hour < 24;
    hour++
  ) {

    const date =
      new Date(selectedDate);

    date.setHours(
      hour,
      0,
      0,
      0
    );

    const row =
      document.createElement("div");

    row.className =
      "hour-row";

    const isToday =
      dateKey(date) ===
      dateKey(today);

    const isCurrentHour =
      isToday &&
      date.getHours() ===
      today.getHours();

    if (isCurrentHour) {
      row.classList.add("current");
    }

    if (
      isToday &&
      date < today &&
      !isCurrentHour
    ) {
      row.classList.add("past");
    }


    /* TIME */

    const timeCell =
      document.createElement("div");

    timeCell.className =
      "time-cell";

    const timeContent =
      document.createElement("div");

    const timeMain =
      document.createElement("div");

    timeMain.className =
      "time-main";

    timeMain.textContent =
      formatHour(date);

    timeContent.appendChild(
      timeMain
    );

    if (isCurrentHour) {

      const nowBadge =
        document.createElement("div");

      nowBadge.className =
        "now-badge";

      nowBadge.textContent =
        "Now";

      timeContent.appendChild(
        nowBadge
      );
    }

    timeCell.appendChild(
      timeContent
    );


    /* WEATHER */

    const weatherCell =
      document.createElement("div");

    weatherCell.className =
      "weather-cell";

    const weather =
      weatherForHour(date);

    if (weather) {

      const icon =
        document.createElement("div");

      icon.className =
        "weather-icon";

      icon.textContent =
        weatherIcon(
          weather.code
        );

      weatherCell.appendChild(
        icon
      );


      const weatherInfo =
        document.createElement("div");

      const temp =
        document.createElement("div");

      temp.className =
        "weather-temp";

      temp.textContent =
        `${Math.round(weather.temperature)}°F`;

      weatherInfo.appendChild(
        temp
      );


      const description =
        document.createElement("div");

      description.className =
        "weather-description";

      description.textContent =
        weatherDescription(
          weather.code
        );

      weatherInfo.appendChild(
        description
      );


      const extra =
        document.createElement("div");

      extra.className =
        "weather-extra";

      extra.textContent =
        `${weather.precipitation ?? 0}% rain · ` +
        `${Math.round(weather.wind ?? 0)} mph wind`;

      weatherInfo.appendChild(
        extra
      );

      weatherCell.appendChild(
        weatherInfo
      );

    } else {

      weatherCell.innerHTML =
        `<span class="free">
           Weather unavailable
         </span>`;
    }


    /* PLANS */

    const planCell =
      document.createElement("div");

    planCell.className =
      "plan-cell";

    const events =
      eventsForHour(date);

    if (events.length === 0) {

      const free =
        document.createElement("div");

      free.className =
        "free";

      free.textContent =
        "No plans";

      planCell.appendChild(
        free
      );

    } else {

      events.forEach(event => {

        const eventBox =
          document.createElement("div");

        eventBox.className =
          "event";

        if (!event.start.dateTime) {

          eventBox.classList.add(
            "all-day-event"
          );
        }


        const title =
          document.createElement("div");

        title.className =
          "event-title";

        title.textContent =
          event.summary ||
          "(No title)";

        eventBox.appendChild(
          title
        );


        const time =
          document.createElement("div");

        time.className =
          "event-time";

        if (event.start.dateTime) {

          time.textContent =
            `${formatHour(eventStart(event))} – ` +
            `${formatHour(eventEnd(event))}`;

        } else {

          time.textContent =
            "All day";
        }

        eventBox.appendChild(
          time
        );


        if (event.location) {

          const location =
            document.createElement("div");

          location.className =
            "event-location";

          location.textContent =
            "📍 " + event.location;

          eventBox.appendChild(
            location
          );
        }

        planCell.appendChild(
          eventBox
        );

      });
    }


    row.appendChild(
      timeCell
    );

    row.appendChild(
      weatherCell
    );

    row.appendChild(
      planCell
    );

    plannerBody.appendChild(
      row
    );
  }
}


/* =========================================================
   LOAD EVERYTHING
========================================================= */

async function refreshWeather() {

  const zip =
    zipInput.value.trim();

  if (!zip) {

    alert(
      "Enter a ZIP code first."
    );

    return;
  }

  plannerBody.innerHTML = `
    <div class="message">
      <div class="spinner"></div>
      Loading weather...
    </div>
  `;

  try {

    weatherData =
      await getWeather(zip);

    localStorage.setItem(
      "dayflowZip",
      zip
    );

    render();

  } catch (error) {

    console.error(error);

    plannerBody.innerHTML = `
      <div class="error">
        ${escapeHtml(error.message)}
      </div>
    `;
  }
}


/* =========================================================
   NAVIGATION
========================================================= */

document
  .getElementById("previousDay")
  .addEventListener(
    "click",
    async () => {

      selectedDate.setDate(
        selectedDate.getDate() - 1
      );

      await reloadForDate();
    }
  );


document
  .getElementById("nextDay")
  .addEventListener(
    "click",
    async () => {

      selectedDate.setDate(
        selectedDate.getDate() + 1
      );

      await reloadForDate();
    }
  );


document
  .getElementById("todayButton")
  .addEventListener(
    "click",
    async () => {

      selectedDate =
        new Date();

      await reloadForDate();
    }
  );


document
  .getElementById("weatherButton")
  .addEventListener(
    "click",
    refreshWeather
  );


zipInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {
      refreshWeather();
    }

  }
);


async function reloadForDate() {

  render();

  /*
   * Weather endpoint already gives several days,
   * so we don't need to fetch it again unless the
   * selected date is outside the loaded forecast.
   */

  if (
    !weatherData ||
    !weatherData.hourly ||
    !weatherData.hourly.time.some(
      t => t.startsWith(
        dateKey(selectedDate)
      )
    )
  ) {

    const zip =
      zipInput.value.trim();

    if (zip) {
      await refreshWeather();
    }
  }

  if (gapi.client.getToken()) {
    await loadCalendar();
  }

  render();
}


/* =========================================================
   SECURITY / HTML ESCAPING
========================================================= */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =========================================================
   INITIALIZATION
========================================================= */

function initializeApp() {

  const savedZip =
    localStorage.getItem(
      "dayflowZip"
    );

  if (savedZip) {
    zipInput.value =
      savedZip;
  }

  render();

  /*
   * If we have a ZIP, load weather automatically.
   */
  if (savedZip) {
    refreshWeather();
  }

  /*
   * Google buttons start disabled until
   * the Google libraries are ready.
   */
  googleButton.disabled = true;
}


/*
 * Google script callbacks.
 *
 * These are called by the Google API script
 * tags after they load.
 */

window.gapiLoaded =
  gapiLoaded;

window.gisLoaded =
  gisLoaded;


/*
 * Because the scripts above don't use onload
 * attributes, explicitly initialize after the
 * page has loaded.
 */

window.addEventListener(
  "load",
  () => {

    if (
      typeof gapi !== "undefined"
    ) {
      gapiLoaded();
    }

    if (
      typeof google !== "undefined" &&
      google.accounts
    ) {
      gisLoaded();
    }

    initializeApp();

  }
);

</script>
