<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="Basic Planner — time, weather, and Google Calendar in one view." />

  <title>Basic Planner</title>

  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --green: #16a34a;
      --yellow: #ca8a04;
      --red: #dc2626;
      --shadow: 0 2px 10px rgba(0,0,0,.06);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* -----------------------------
       Header
    ----------------------------- */

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(17, 24, 39, .97);
      color: white;
      border-bottom: 1px solid #374151;
    }

    .header-inner {
      max-width: 1500px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: #2563eb;
      font-weight: 800;
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1;
    }

    .brand small {
      color: #9ca3af;
      display: block;
      margin-top: 4px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    /* -----------------------------
       Controls
    ----------------------------- */

    .controls {
      max-width: 1500px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    input,
    select {
      border: 1px solid var(--border);
      background: white;
      border-radius: 8px;
      padding: 9px 11px;
      color: var(--text);
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }

    input[type="date"] {
      min-width: 145px;
    }

    .zip-input {
      width: 100px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 9px 13px;
      background: var(--accent);
      color: white;
      font-weight: 650;
    }

    button:hover {
      background: var(--accent-dark);
    }

    button.secondary {
      background: white;
      color: var(--text);
      border: 1px solid var(--border);
    }

    button.secondary:hover {
      background: #f3f4f6;
    }

    button.danger {
      background: #fee2e2;
      color: #991b1b;
    }

    /* -----------------------------
       Status
    ----------------------------- */

    .status {
      max-width: 1500px;
      margin: 0 auto;
      padding: 0 20px 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .status.error {
      color: var(--red);
    }

    .status.success {
      color: var(--green);
    }

    /* -----------------------------
       Planner
    ----------------------------- */

    .planner-wrap {
      max-width: 1500px;
      margin: 0 auto;
      padding: 0 20px 40px;
    }

    .planner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .column-headings {
      display: grid;
      grid-template-columns: 150px 280px minmax(300px, 1fr);
      background: #f9fafb;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 67px;
      z-index: 10;
    }

    .column-heading {
      padding: 13px 16px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .07em;
      font-weight: 750;
      color: var(--muted);
      border-right: 1px solid var(--border);
    }

    .column-heading:last-child {
      border-right: 0;
    }

    .hour-row {
      display: grid;
      grid-template-columns: 150px 280px minmax(300px, 1fr);
      min-height: 86px;
      border-bottom: 1px solid var(--border);
    }

    .hour-row:last-child {
      border-bottom: 0;
    }

    .hour-row.current-hour {
      background: rgba(37, 99, 235, .035);
      box-shadow: inset 4px 0 0 var(--accent);
    }

    .hour-cell {
      padding: 13px 16px;
      border-right: 1px solid var(--border);
    }

    .hour-cell:last-child {
      border-right: 0;
    }

    /* Time column */

    .time {
      font-size: 15px;
      font-weight: 750;
    }

    .time-sub {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .now-badge {
      display: inline-block;
      margin-top: 7px;
      padding: 3px 7px;
      border-radius: 99px;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
    }

    /* Weather column */

    .weather {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .weather-icon {
      font-size: 30px;
      width: 40px;
      text-align: center;
    }

    .weather-temp {
      font-size: 18px;
      font-weight: 750;
    }

    .weather-desc {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .weather-extra {
      color: var(--muted);
      font-size: 11px;
      margin-top: 5px;
    }

    .weather-loading {
      color: var(--muted);
      font-size: 13px;
    }

    /* Calendar column */

    .event {
      border-left: 4px solid var(--accent);
      background: #eff6ff;
      padding: 9px 11px;
      border-radius: 7px;
      margin-bottom: 7px;
    }

    .event:last-child {
      margin-bottom: 0;
    }

    .event-title {
      font-weight: 700;
      font-size: 14px;
    }

    .event-time {
      color: #4b5563;
      font-size: 12px;
      margin-top: 3px;
    }

    .event-location {
      color: #6b7280;
      font-size: 11px;
      margin-top: 4px;
    }

    .no-events {
      color: #9ca3af;
      font-size: 13px;
    }

    .all-day {
      background: #f3f4f6;
      border-left-color: #6b7280;
    }

    /* -----------------------------
       Connection panel
    ----------------------------- */

    .calendar-status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #d1d5db;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6b7280;
    }

    .status-dot.connected {
      background: #22c55e;
    }

    /* -----------------------------
       Empty / setup state
    ----------------------------- */

    .setup {
      padding: 55px 25px;
      text-align: center;
    }

    .setup-icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .setup h2 {
      margin: 0 0 8px;
    }

    .setup p {
      max-width: 600px;
      margin: 0 auto 20px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* -----------------------------
       Responsive
    ----------------------------- */

    @media (max-width: 900px) {
      .column-headings {
        grid-template-columns: 100px 210px minmax(260px, 1fr);
      }

      .hour-row {
        grid-template-columns: 100px 210px minmax(260px, 1fr);
      }

      .hour-cell,
      .column-heading {
        padding-left: 10px;
        padding-right: 10px;
      }
    }

    @media (max-width: 700px) {
      header {
        position: static;
      }

      .header-inner {
        align-items: flex-start;
      }

      .header-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .controls {
        flex-direction: column;
        align-items: stretch;
      }

      .control-group {
        justify-content: space-between;
      }

      .planner-wrap {
        padding-left: 8px;
        padding-right: 8px;
      }

      .planner {
        overflow-x: auto;
      }

      .column-headings,
      .hour-row {
        min-width: 680px;
      }

      .column-headings {
        position: static;
      }
    }
  </style>

  <!-- Google API client -->
  <script src="https://apis.google.com/js/api.js"></script>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client"></script>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark">BP</div>
      <div>
        <h1>Basic Planner</h1>
        <small>Time · Weather · Plans</small>
      </div>
    </div>

    <div class="header-actions">
      <div class="calendar-status">
        <span id="statusDot" class="status-dot"></span>
        <span id="calendarStatus">Calendar not connected</span>
      </div>

      <button
        id="connectButton"
        onclick="connectGoogleCalendar()"
      >
        Connect Google Calendar
      </button>

      <button
        id="disconnectButton"
        class="secondary"
        style="display:none"
        onclick="disconnectGoogleCalendar()"
      >
        Disconnect
      </button>
    </div>
  </div>
</header>

<div class="controls">

  <div class="control-group">
    <label for="datePicker">Day</label>
    <input type="date" id="datePicker" />
  </div>

  <div class="control-group">
    <label for="zipCode">ZIP</label>
    <input
      id="zipCode"
      class="zip-input"
      type="text"
      inputmode="numeric"
      maxlength="10"
      placeholder="48601"
    />
    <button onclick="loadWeather()">Weather</button>
  </div>

  <div class="control-group" id="calendarSelectorGroup" style="display:none">
    <label for="calendarSelector">Calendar</label>
    <select id="calendarSelector" onchange="calendarChanged()"></select>
  </div>

  <button class="secondary" onclick="refreshPlanner()">
    ↻ Refresh
  </button>

</div>

<div id="statusMessage" class="status">
  Enter your ZIP code and connect Google Calendar to get started.
</div>

<main class="planner-wrap">
  <div class="planner">

    <div class="column-headings">
      <div class="column-heading">Time</div>
      <div class="column-heading">Weather</div>
      <div class="column-heading">Plan</div>
    </div>

    <div id="plannerRows"></div>

  </div>
</main>


<script>
/* ============================================================
   BASIC PLANNER
   Single-file application
   ============================================================ */


/* ------------------------------------------------------------
   CONFIGURATION
   ------------------------------------------------------------

   Replace CLIENT_ID with the OAuth 2.0 Web Client ID from
   your Google Cloud project.

   Example:

   123456789012-abcdefghijklmnop.apps.googleusercontent.com
------------------------------------------------------------ */

const CLIENT_ID = "YOUR_GOOGLE_OAUTH_CLIENT_ID.apps.googleusercontent.com";

const DISCOVERY_DOC =
  "https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest";

const SCOPES =
  "https://www.googleapis.com/auth/calendar.readonly";


/* ------------------------------------------------------------
   STATE
------------------------------------------------------------ */

let tokenClient = null;
let gapiReady = false;
let gisReady = false;
let accessToken = null;

let calendars = [];
let selectedCalendarId = "primary";

let weatherData = null;
let weatherLocation = null;


/* ------------------------------------------------------------
   INITIALIZATION
------------------------------------------------------------ */

document.addEventListener("DOMContentLoaded", () => {

  // Today's date.
  const today = new Date();

  document.getElementById("datePicker").value =
    formatDateInput(today);

  // Load saved ZIP.
  const savedZip = localStorage.getItem("basicPlannerZip");

  if (savedZip) {
    document.getElementById("zipCode").value = savedZip;
  }

  // Draw the basic hour grid immediately.
  renderPlanner();

  // Google APIs may already be loaded or may still be loading.
  waitForGoogleLibraries();
});


function waitForGoogleLibraries() {

  if (window.gapi && window.google) {
    initializeGoogle();
    return;
  }

  setTimeout(waitForGoogleLibraries, 100);
}


async function initializeGoogle() {

  if (!window.gapi || !window.google) {
    return;
  }

  if (!gapiReady) {
    await new Promise(resolve => {
      gapi.load("client", async () => {

        await gapi.client.init({
          discoveryDocs: [DISCOVERY_DOC]
        });

        gapiReady = true;
        resolve();
      });
    });
  }

  if (!gisReady) {

    tokenClient =
      google.accounts.oauth2.initTokenClient({

        client_id: CLIENT_ID,

        scope: SCOPES,

        callback: response => {
          if (response.error) {
            showStatus(
              "Google authorization failed: " +
              response.error,
              true
            );
            return;
          }

          accessToken = response.access_token;

          gapi.client.setToken({
            access_token: accessToken
          });

          onGoogleConnected();
        }
      });

    gisReady = true;
  }
}


/* ------------------------------------------------------------
   GOOGLE CALENDAR AUTHENTICATION
------------------------------------------------------------ */

function connectGoogleCalendar() {

  if (CLIENT_ID.includes("YOUR_GOOGLE")) {

    alert(
      "First replace CLIENT_ID in the HTML with your Google OAuth Web Client ID."
    );

    return;
  }

  if (!gisReady) {

    showStatus(
      "Google services are still loading. Try again in a moment.",
      true
    );

    return;
  }

  tokenClient.requestAccessToken({
    prompt: accessToken ? "" : "consent"
  });
}


async function onGoogleConnected() {

  document.getElementById("connectButton").style.display = "none";
  document.getElementById("disconnectButton").style.display = "inline-block";

  document.getElementById("statusDot")
    .classList.add("connected");

  document.getElementById("calendarStatus").textContent =
    "Google Calendar connected";

  try {

    await loadCalendars();

    await loadCalendarEvents();

  } catch (error) {

    console.error(error);

    showStatus(
      "Connected to Google, but the calendar could not be loaded.",
      true
    );
  }
}


function disconnectGoogleCalendar() {

  if (accessToken && google.accounts.oauth2) {

    google.accounts.oauth2.revoke(
      accessToken,
      () => {}
    );
  }

  accessToken = null;

  if (window.gapi && gapi.client) {
    gapi.client.setToken(null);
  }

  calendars = [];

  document.getElementById("calendarSelectorGroup")
    .style.display = "none";

  document.getElementById("connectButton")
    .style.display = "inline-block";

  document.getElementById("disconnectButton")
    .style.display = "none";

  document.getElementById("statusDot")
    .classList.remove("connected");

  document.getElementById("calendarStatus").textContent =
    "Calendar not connected";

  renderPlanner();

  showStatus(
    "Google Calendar disconnected."
  );
}


/* ------------------------------------------------------------
   CALENDAR LIST
------------------------------------------------------------ */

async function loadCalendars() {

  const response =
    await gapi.client.calendar.calendarList.list({
      minAccessRole: "reader",
      showDeleted: false
    });

  calendars =
    response.result.items || [];

  const selector =
    document.getElementById("calendarSelector");

  selector.innerHTML = "";

  calendars.forEach(calendar => {

    const option =
      document.createElement("option");

    option.value = calendar.id;

    option.textContent =
      calendar.summaryOverride ||
      calendar.summary ||
      calendar.id;

    if (calendar.primary) {
      option.selected = true;
      selectedCalendarId = calendar.id;
    }

    selector.appendChild(option);
  });

  if (calendars.length) {

    document.getElementById(
      "calendarSelectorGroup"
    ).style.display = "flex";
  }
}


function calendarChanged() {

  selectedCalendarId =
    document.getElementById(
      "calendarSelector"
    ).value;

  loadCalendarEvents();
}


/* ------------------------------------------------------------
   CALENDAR EVENTS
------------------------------------------------------------ */

async function loadCalendarEvents() {

  if (!accessToken) {
    renderPlanner();
    return;
  }

  const date =
    document.getElementById("datePicker").value;

  if (!date) return;

  const start =
    new Date(date + "T00:00:00");

  const end =
    new Date(start);

  end.setDate(end.getDate() + 1);

  showStatus("Loading calendar events...");

  try {

    const response =
      await gapi.client.calendar.events.list({

        calendarId: selectedCalendarId,

        timeMin: start.toISOString(),

        timeMax: end.toISOString(),

        singleEvents: true,

        orderBy: "startTime",

        showDeleted: false,

        maxResults: 250
      });

    const events =
      response.result.items || [];

    window.currentEvents = events;

    renderPlanner();

    showStatus(
      `${events.length} calendar event${events.length === 1 ? "" : "s"} loaded.`,
      false,
      true
    );

  } catch (error) {

    console.error(error);

    if (
      error.status === 401 ||
      error.result?.error?.code === 401
    ) {

      accessToken = null;

      showStatus(
        "Your Google authorization expired. Please reconnect.",
        true
      );

      return;
    }

    showStatus(
      "Unable to load calendar events.",
      true
    );
  }
}


/* ------------------------------------------------------------
   WEATHER
------------------------------------------------------------ */

async function loadWeather() {

  const zip =
    document.getElementById("zipCode").value.trim();

  if (!zip) {

    showStatus(
      "Please enter a ZIP code.",
      true
    );

    return;
  }

  localStorage.setItem(
    "basicPlannerZip",
    zip
  );

  showStatus("Finding ZIP code...");

  try {

    /*
      Open-Meteo's geocoding endpoint accepts postal codes.
    */

    const geoUrl =
      "https://geocoding-api.open-meteo.com/v1/search?" +
      new URLSearchParams({
        name: zip,
        count: 1,
        language: "en",
        format: "json"
      });

    const geoResponse =
      await fetch(geoUrl);

    if (!geoResponse.ok) {
      throw new Error("Geocoding request failed.");
    }

    const geo =
      await geoResponse.json();

    if (!geo.results || !geo.results.length) {

      throw new Error(
        "ZIP code could not be located."
      );
    }

    const location =
      geo.results[0];

    weatherLocation = location;

    showStatus(
      `Loading weather for ${location.name}, ${location.admin1 || ""}...`
    );

    /*
      Request hourly weather.

      We ask for the entire current forecast period and
      then use the appropriate day's 24 hourly entries.
    */

    const weatherUrl =
      "https://api.open-meteo.com/v1/forecast?" +
      new URLSearchParams({

        latitude: location.latitude,

        longitude: location.longitude,

        hourly: [
          "temperature_2m",
          "apparent_temperature",
          "precipitation_probability",
          "weather_code",
          "wind_speed_10m"
        ].join(","),

        temperature_unit: "fahrenheit",

        wind_speed_unit: "mph",

        timezone: "auto",

        forecast_days: 7
      });

    const weatherResponse =
      await fetch(weatherUrl);

    if (!weatherResponse.ok) {
      throw new Error("Weather request failed.");
    }

    weatherData =
      await weatherResponse.json();

    renderPlanner();

    showStatus(
      `Weather loaded for ${location.name}, ${location.admin1 || ""}.`,
      false,
      true
    );

  } catch (error) {

    console.error(error);

    showStatus(
      error.message || "Unable to load weather.",
      true
    );
  }
}


/* ------------------------------------------------------------
   WEATHER HELPERS
------------------------------------------------------------ */

function weatherForHour(date) {

  if (!weatherData || !weatherData.hourly) {
    return null;
  }

  const target =
    formatLocalWeatherDate(date);

  const index =
    weatherData.hourly.time.findIndex(
      time => time.startsWith(target)
    );

  if (index === -1) {
    return null;
  }

  return {

    temperature:
      weatherData.hourly.temperature_2m[index],

    apparent:
      weatherData.hourly.apparent_temperature[index],

    precipitation:
      weatherData.hourly.precipitation_probability[index],

    code:
      weatherData.hourly.weather_code[index],

    wind:
      weatherData.hourly.wind_speed_10m[index]
  };
}


function weatherIcon(code) {

  if (code === 0) return "☀️";

  if ([1,2,3].includes(code))
    return "🌤️";

  if ([45,48].includes(code))
    return "🌫️";

  if ([51,53,55,56,57].includes(code))
    return "🌦️";

  if ([61,63,65,66,67].includes(code))
    return "🌧️";

  if ([71,73,75,77].includes(code))
    return "🌨️";

  if ([80,81,82].includes(code))
    return "🌦️";

  if ([85,86].includes(code))
    return "🌨️";

  if ([95,96,99].includes(code))
    return "⛈️";

  return "🌡️";
}


function weatherDescription(code) {

  const descriptions = {

    0: "Clear",

    1: "Mostly clear",

    2: "Partly cloudy",

    3: "Overcast",

    45: "Foggy",

    48: "Foggy",

    51: "Light drizzle",

    53: "Drizzle",

    55: "Heavy drizzle",

    56: "Freezing drizzle",

    57: "Freezing drizzle",

    61: "Light rain",

    63: "Rain",

    65: "Heavy rain",

    66: "Freezing rain",

    67: "Freezing rain",

    71: "Light snow",

    73: "Snow",

    75: "Heavy snow",

    77: "Snow grains",

    80: "Rain showers",

    81: "Rain showers",

    82: "Heavy showers",

    85: "Snow showers",

    86: "Snow showers",

    95: "Thunderstorm",

    96: "Thunderstorm",

    99: "Thunderstorm"
  };

  return descriptions[code] || "Unknown";
}


/* ------------------------------------------------------------
   PLANNER RENDERING
------------------------------------------------------------ */

function renderPlanner() {

  const container =
    document.getElementById("plannerRows");

  container.innerHTML = "";

  const dateString =
    document.getElementById("datePicker").value;

  if (!dateString) return;

  const selectedDate =
    new Date(dateString + "T00:00:00");

  const events =
    window.currentEvents || [];

  /*
    Display 24 hours.

    We intentionally keep this simple:
    one row = one hour.
  */

  for (let hour = 0; hour < 24; hour++) {

    const row =
      document.createElement("div");

    row.className = "hour-row";

    const hourDate =
      new Date(selectedDate);

    hourDate.setHours(hour, 0, 0, 0);

    if (isCurrentHour(hourDate)) {
      row.classList.add("current-hour");
    }

    /* ---------------- TIME ---------------- */

    const timeCell =
      document.createElement("div");

    timeCell.className =
      "hour-cell";

    timeCell.innerHTML = `

      <div class="time">
        ${formatHour(hour)}
      </div>

      <div class="time-sub">
        ${hour === 0 ? "Midnight" :
          hour === 12 ? "Noon" :
          hour < 12 ? "Morning" :
          "Afternoon / evening"}
      </div>

      ${
        isCurrentHour(hourDate)
          ? `<div class="now-badge">Now</div>`
          : ""
      }

    `;

    /* ---------------- WEATHER ---------------- */

    const weatherCell =
      document.createElement("div");

    weatherCell.className =
      "hour-cell";

    const weather =
      weatherForHour(hourDate);

    if (weather) {

      weatherCell.innerHTML = `

        <div class="weather">

          <div class="weather-icon">
            ${weatherIcon(weather.code)}
          </div>

          <div>

            <div class="weather-temp">
              ${Math.round(weather.temperature)}°F
            </div>

            <div class="weather-desc">
              ${weatherDescription(weather.code)}
            </div>

            <div class="weather-extra">
              Feels ${Math.round(weather.apparent)}° ·
              ${weather.precipitation}% rain ·
              ${Math.round(weather.wind)} mph wind
            </div>

          </div>

        </div>
      `;

    } else {

      weatherCell.innerHTML =
        `<div class="weather-loading">
          ${
            weatherData
              ? "No forecast available"
              : "Enter ZIP for weather"
          }
        </div>`;
    }

    /* ---------------- CALENDAR ---------------- */

    const planCell =
      document.createElement("div");

    planCell.className =
      "hour-cell";

    const matchingEvents =
      getEventsForHour(
        events,
        hourDate
      );

    if (!matchingEvents.length) {

      planCell.innerHTML =
        `<div class="no-events">No plans</div>`;

    } else {

      matchingEvents.forEach(event => {

        const eventElement =
          createEventElement(event);

        planCell.appendChild(
          eventElement
        );
      });
    }

    row.appendChild(timeCell);
    row.appendChild(weatherCell);
    row.appendChild(planCell);

    container.appendChild(row);
  }
}


/* ------------------------------------------------------------
   CALENDAR EVENT HELPERS
------------------------------------------------------------ */

function getEventsForHour(events, hourDate) {

  const hourStart =
    new Date(hourDate);

  const hourEnd =
    new Date(hourDate);

  hourEnd.setHours(
    hourEnd.getHours() + 1
  );

  return events.filter(event => {

    /*
      All-day events.
    */

    if (event.start?.date) {

      const day =
        event.start.date;

      return day ===
        document.getElementById(
          "datePicker"
        ).value;
    }

    const start =
      new Date(event.start.dateTime);

    const end =
      new Date(event.end.dateTime);

    return (
      start < hourEnd &&
      end > hourStart
    );
  });
}


function createEventElement(event) {

  const element =
    document.createElement("div");

  const isAllDay =
    !!event.start?.date;

  element.className =
    "event" +
    (isAllDay ? " all-day" : "");

  let timeText = "All day";

  if (!isAllDay) {

    const start =
      new Date(event.start.dateTime);

    const end =
      new Date(event.end.dateTime);

    timeText =
      `${formatTime(start)} – ${formatTime(end)}`;
  }

  element.innerHTML = `

    <div class="event-title">
      ${escapeHtml(
        event.summary || "(No title)"
      )}
    </div>

    <div class="event-time">
      ${timeText}
    </div>

    ${
      event.location
        ? `<div class="event-location">
             📍 ${escapeHtml(event.location)}
           </div>`
        : ""
    }

  `;

  return element;
}


/* ------------------------------------------------------------
   REFRESH
------------------------------------------------------------ */

async function refreshPlanner() {

  const zip =
    document.getElementById("zipCode").value.trim();

  if (zip) {
    await loadWeather();
  }

  if (accessToken) {
    await loadCalendarEvents();
  } else {
    renderPlanner();
  }
}

document

/* ------------------------------------------------------------
   STATUS
------------------------------------------------------------ */

function showStatus(
  message,
  error = false,
  success = false
) {

  const element =
    document.getElementById(
      "statusMessage"
    );

  element.textContent = message;

  element.className = "status";

  if (error) {
    element.classList.add("error");
  }

  if (success) {
    element.classList.add("success");
  }
}


/* ------------------------------------------------------------
   FORMATTING
------------------------------------------------------------ */

function formatDateInput(date) {

  const year =
    date.getFullYear();

  const month =
    String(date.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(date.getDate())
      .padStart(2, "0");

  return `${year}-${month}-${day}`;
}


function formatLocalWeatherDate(date) {

  const year =
    date.getFullYear();

  const month =
    String(date.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(date.getDate())
      .padStart(2, "0");

  const hour =
    String(date.getHours())
      .padStart(2, "0");

  return `${year}-${month}-${day}T${hour}:00`;
}


function formatHour(hour) {

  const suffix =
    hour >= 12 ? "PM" : "AM";

  let displayHour =
    hour % 12;

  if (displayHour === 0) {
    displayHour = 12;
  }

  return `${displayHour}:00 ${suffix}`;
}


function formatTime(date) {

  return date.toLocaleTimeString(
    [],
    {
      hour: "numeric",
      minute: "2-digit"
    }
  );
}


function isCurrentHour(date) {

  const now =
    new Date();

  return (
    now.getFullYear() === date.getFullYear() &&
    now.getMonth() === date.getMonth() &&
    now.getDate() === date.getDate() &&
    now.getHours() === date.getHours()
  );
}


/* ------------------------------------------------------------
   SECURITY
------------------------------------------------------------ */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* ------------------------------------------------------------
   BASIC PWA METADATA
------------------------------------------------------------

   A complete offline PWA needs a service worker served from
   the same origin. Because this project intentionally remains
   one HTML file, we create the manifest dynamically.

   The app assumes internet access, so API data remains live.
------------------------------------------------------------ */

(function setupPwaManifest() {

  const manifest = {

    name: "Basic Planner",

    short_name: "Planner",

    start_url: "./",

    display: "standalone",

    background_color: "#f4f5f7",

    theme_color: "#111827",

    description:
      "Time, weather, and Google Calendar in one simple planner.",

    icons: [
      {
        src:
          "data:image/svg+xml," +
          encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 512 512">
              <rect width="512"
                    height="512"
                    rx="100"
                    fill="#2563eb"/>
              <text x="256"
                    y="310"
                    text-anchor="middle"
                    font-size="150"
                    font-family="Arial"
                    font-weight="bold"
                    fill="white">BP</text>
            </svg>
          `),
        sizes: "512x512",
        type: "image/svg+xml"
      }
    ]
  };

  const blob =
    new Blob(
      [JSON.stringify(manifest)],
      { type: "application/manifest+json" }
    );

  const url =
    URL.createObjectURL(blob);

  const link =
    document.createElement("link");

  link.rel = "manifest";
  link.href = url;

  document.head.appendChild(link);

})();
</script>
